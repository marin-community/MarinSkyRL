defaults:
  - _self_
  - deepspeed_config@deepspeed_config.train: train
  - deepspeed_config@deepspeed_config.eval: eval
  - megatron_config@trainer.policy.megatron_config: policy
  - megatron_config@trainer.ref.megatron_config: ref
  - skyrl_gym_config: default

data:
  train_data: ["${oc.env:HOME}/data/gsm8k/train.parquet"]
  val_data: ["${oc.env:HOME}/data/gsm8k/validation.parquet"]

checkpoint_export:
  step: null
  checkpoint_path: null
  export_root: null
  hf_hub_repo_id: null
  hf_hub_private: false
  hf_hub_revision: main
  hf_upload_mode: latest

trainer:
  debug_mode: "off"
  collective_phase_diagnostics: false
  distributed:
    placement_group_timeout_seconds: 180
    worker_collective_timeout_seconds: 1800
  model_load_retry:
    max_retries: 5
    backoff_base_seconds: 2.0
    backoff_cap_seconds: 32.0
  progress:
    mode: "auto"
    min_interval_seconds: 0.5
    heartbeat_seconds: 60.0
    percent_step: 5.0
    count_step: 1000
  placement:
    colocate_all: true
    colocate_policy_ref: true
    policy_num_nodes: 1
    policy_num_gpus_per_node: 4
    critic_num_nodes: 1
    critic_num_gpus_per_node: 4
    ref_num_nodes: 1
    ref_num_gpus_per_node: 4
    policy_strict_spread_pg: false
    policy_per_gpu_bundles: false
    policy_force_cvd_mask: false
    enable_numa_affinity: false
  sequence_parallel_backend: "ulysses"
  strategy: fsdp2
  policy:
    host_memory_monitor:
      enabled: true
      interval_seconds: 60
    # frozen preserves the checkpoint bias; replace and interpolate use Quantile
    # Balancing; loss_free uses DeepSeek's signed load-error update.
    grug_query_bias_update_mode: "frozen"
    grug_query_bias_interpolation_weight: null
    grug_query_bias_update_rate: null
    model:
      path: "Qwen/Qwen2.5-1.5B-Instruct"
      source_uri: null
      source_identity: null
      lora:
          rank: 0
          alpha: 16
          dropout: 0
          lora_sync_path: "/tmp/skyrl_lora_sync"
          target_modules: "all-linear"
          exclude_modules: null
    deepspeed_config: ${deepspeed_config.train}
    optimizer_config:
      optimizer: "AdamW"
      fsdp_parameter_storage_dtype: null
      lr: 1.0e-6
      adam_betas: [0.9, 0.999]
      weight_decay: 1e-2
      max_grad_norm: 1.0
      offload_after_step: true
      num_warmup_steps: 0
      scheduler: "constant_with_warmup"
      optimizer_kwargs: {}
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: -1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      moe_token_dispatcher_type: "alltoall"
      moe_router_replay: false
      moe_grouped_gemm: false
      use_grouped_mm: false
      ep_comm_backend: "torch"
      deepep_num_sms: 20
      deepep_token_chunk_size: null
      context_parallel_size: 1
      expert_loader_chunk_rows: 8
      cp_style: "ring_sdpa"
      cp_rotate_method: "allgather"
    sequence_parallel_size: 1
    use_torch_compile: false
    record_memory: false
  ref:
    model:
      path: ${trainer.policy.model.path}
    sequence_parallel_size: 1
    deepspeed_config: ${deepspeed_config.eval}
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: -1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      moe_token_dispatcher_type: "alltoall"
      moe_router_replay: false
      moe_grouped_gemm: false
      use_grouped_mm: false
      ep_comm_backend: "torch"
      deepep_num_sms: 20
      deepep_token_chunk_size: null
      context_parallel_size: 1
      expert_loader_chunk_rows: ${trainer.policy.fsdp_config.expert_loader_chunk_rows}
      cp_style: "ring_sdpa"
      cp_rotate_method: "allgather"
  critic:
    model:
      path: null
      lora:
        rank: 0
        alpha: 16
        dropout: 0
        target_modules: "all-linear"
        exclude_modules: null
    deepspeed_config: ${deepspeed_config.train}
    optimizer_config:
      optimizer: "AdamW"
      fsdp_parameter_storage_dtype: null
      lr: 5.0e-6
      adam_betas: [0.9, 0.999]
      weight_decay: 1e-2
      max_grad_norm: 1.0
      offload_after_step: true
      num_warmup_steps: 0
      scheduler: "constant_with_warmup"
      optimizer_kwargs: {}
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: -1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      moe_token_dispatcher_type: "alltoall"
      moe_router_replay: false
      moe_grouped_gemm: false
      use_grouped_mm: false
      ep_comm_backend: "torch"
      deepep_num_sms: 20
      deepep_token_chunk_size: null
      context_parallel_size: 1
      expert_loader_chunk_rows: ${trainer.policy.fsdp_config.expert_loader_chunk_rows}
      cp_style: "ring_sdpa"
      cp_rotate_method: "allgather"
    sequence_parallel_size: 1
  algorithm:
    batch_invariant: false
    advantage_estimator: "grpo"
    group_advantage_min_size: null
    resolved_group_advantage:
      kind: exact_physical
      physical_group_size: ${generator.n_samples_per_prompt}
      minimum_group_size: null
    kl_ctrl:
      type: "fixed"
      kl_target: 0.1
      horizon: 10000
    kl_estimator_type: "k3"
    use_kl_estimator_k3: false
    use_abs_kl: false
    use_kl_in_reward: false
    use_kl_loss: true
    kl_loss_coef: 0.001
    use_entropy_loss: false
    entropy_loss_coef: 0.01
    advantage_batch_normalize: false
    value_head_prefix: "value_head"
    policy_loss_type: "regular"
    loss_reduction: "token_mean"
    grpo_norm_by_std: true
    rloo_n_filter_zero_reward_groups: true
    lambd: 1.0
    gamma: 1.0
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    clip_ratio_c: 3.0
    tis_imp_ratio_cap: -1.0
    use_tis: false
    tito_full: null
    tis_splice: true
    tis_lcs_alert_threshold: 0.005
    enable_token_reward_channel: false
    think_token_weight: 1.0
    think_token_cost: 0.0
    think_max_cost_per_turn: 0.05
    sapo:
      tau_pos: 1.0
      tau_neg: 1.05
    
    value_clip: 0.2
    dynamic_sampling:
      type: null
      max_sample_batches: 30
      min_replace_ratio: 0.3
      informative_on: shaped
      min_reward_std: 0.0
    
    clip_cov:
      clip_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
    
    kl_cov:
      kl_cov_frac: 0.2
      ppo_kl_coef: 1.0
    
    cispo:
      cispo_eps_clip_low: 0
      cispo_eps_clip_high: 5

    z_clip:
      enabled: false
      alpha: 0.97
      z_thresh: 2.5
      warmup_steps: 25
      mode: "zscore"
      clip_option: "adaptive_scaling"
      clip_factor: 1.0
      skip_update_on_spike: false

    stale_clip:
      enabled: false
      alpha: 0.3
      entropy_threshold: 0.15
      entropy_window: 10
      min_lr_scale: 0.1

  fully_async:
    max_staleness_steps: 4

    num_parallel_generation_workers: 768
    admission_stall_timeout: 21600

  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  seed: 42
  resume_mode: latest
  resume_path: null
  ckpt_path: "${oc.env:HOME}/ckpts/"
  max_ckpts_to_keep: -1
  ckpt_interval: 5
  hf_save_interval: ${trainer.ckpt_interval}
  hf_upload_mode: latest
  export_path: "${oc.env:HOME}/exports"
  bf16: true
  epochs: 1
  max_steps: null
  update_epochs_per_batch: 1
  train_batch_size: 1024
  policy_mini_batch_size: 256
  critic_mini_batch_size: 256
  micro_train_batch_size_per_gpu: 1
  micro_forward_batch_size_per_gpu: 1
  update_ref_every_epoch: false
  use_sample_packing: true
  eval_batch_size: 1024
  eval_before_train: true
  eval_interval: 5
  preflight_gate:
    enabled: false
    min_reward: 0.25
    max_reward: 0.75
    num_trials: 256
    on_failure: "abort"
  max_prompt_length: 512
  flash_attn: false
  attn_backend: "auto"
  disable_fast_tokenizer: false
  target_modules: null
  exclude_modules: null
  project_name: "skyrl"
  run_name: "test_run"
  logger: "wandb"
  tracker_commit_each_step: false
  dump_data_batch: false
  dump_eval_results: true
  log_level: "INFO"

  rope_scaling: null
  rope_theta: null

  step_wise_training: false

generator:
  model_name: ${trainer.policy.model.path}
  model_dtype: "bfloat16"
  timeout_multiplier: 1.0
  engine_init_timeout_seconds: 1800
  run_engines_locally: true
  num_inference_engines: 1
  backend: "vllm"
  vllm_attention_backend: null
  weight_sync_backend: "nccl"
  fuse_weights: false
  r3_transport: "decentral"
  r3_dispatch_put_timeout_seconds: 600
  coordinator_executor_workers: 256
  gdn_backend: "torch"
  weight_transfer_threshold_cuda_ipc_GB: 1.0
  inference_engine_tensor_parallel_size: 4
  inference_engine_pipeline_parallel_size: 1
  inference_engine_expert_parallel_size: 1
  inference_engine_data_parallel_size: 1
  inference_engine_decode_context_parallel_size: 1
  inference_engine_mp_backend: false
  n_samples_per_prompt: 5
  async_engine: true
  batched: false
  max_input_length: ${trainer.max_prompt_length}
  vllm_v1_disable_multiproc: true
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_batched_tokens: 8192
  enforce_eager: true
  fully_sharded_loras: false
  vllm_stats_interval: 1
  gpu_memory_utilization: 0.8
  max_num_seqs: 1024
  remote_inference_engine_urls: ["127.0.0.1:8001"]
  enable_http_endpoint: false
  http_endpoint_host: "127.0.0.1"
  http_endpoint_port: 8000
  max_turns: 1

  chat_template:
    source: "name"
    name_or_path: null
  
  chat_template_kwargs: {}

  engine_init_kwargs: {}
  
  override_existing_update_group: "auto"
  sampling_params:
    max_generate_length: 1024
    repetition_penalty: 1.0
    temperature: 1.0
    top_p: 1.0
    min_p: 0.0
    top_k: -1
    logprobs: null
    stop: null

  use_conversation_multi_turn: true

  append_eos_token_after_stop_str_in_multi_turn: true

  eval_sampling_params:
    max_generate_length: ${generator.sampling_params.max_generate_length}
    repetition_penalty: 1.0
    temperature: 0.0
    top_p: 1.0
    min_p: 0.0
    top_k: -1
    logprobs: null
    stop: null

  eval_n_samples_per_prompt: 1

  trajectory_reward_shaping:
    schema_version: 2
    enabled: false
    loop:
      max_period_tokens: 64
      tail_tokens: 256
      minimum_occurrences: 4
      advantage_penalty_per_token: 0.0
      max_advantage_penalty: 0.2
    non_termination:
      penalty: 0.0
      accepted_stop_reasons: [stop, complete, eos, end_turn]
    overlong:
      l_max: ${generator.sampling_params.max_generate_length}
      l_cache: 0
      penalty_scale: 1.0
    successful_length:
      free_tokens: 0
      penalty_per_token: 0.0
      max_penalty: 0.2

  trajectory_retention:
    enabled: true
    output_path: ${trainer.export_path}/training_trajectories
    run_id: ${trainer.run_name}
    phases: [train]
    sample_count_per_step: 1
    sample_fraction: 0.0
    always_retain_failures: true
    always_retain_non_terminating: true
    always_retain_loops: true
    accepted_stop_reasons: ${generator.trajectory_reward_shaping.non_termination.accepted_stop_reasons}
    reward_below: null
    reward_above: null
    max_bytes_per_step: 8388608
    max_bytes_per_run: 268435456
    required: false
    publish_timeout_seconds: 120
    shutdown_timeout_seconds: 30
    redact_fields: []
    model_path: ${trainer.policy.model.path}
    model_source_identity: ${trainer.policy.model.source_identity}
    resume_path: ${trainer.resume_path}
    inference_backend: ${generator.backend}

  apply_overlong_filtering: false

  rope_scaling: ${trainer.rope_scaling}
  rope_theta: ${trainer.rope_theta}

teacher:
  model_path: null
  top_k_logprobs: 256
  num_inference_engines: 1
  inference_engine_tensor_parallel_size: 1
  inference_engine_pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  enforce_eager: false
  backend: vllm
  engine_init_timeout_seconds: ${generator.engine_init_timeout_seconds}
  engine_init_kwargs: {}

environment:
  env_class: "gsm8k"

rollout:
  fanout:
    enabled: true
    num_coordinators: 4
    cpus_per_coordinator: 8
    coordinator_rpc_timeout: 21600
