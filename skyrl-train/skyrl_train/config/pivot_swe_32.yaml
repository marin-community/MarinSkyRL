defaults:
  - pivot_swe_smoke
  - _self_

data:
  train_data: ["${oc.env:PIVOT_D_PIVOT_URI}"]
  val_data: ["${oc.env:PIVOT_PROBE_URI}"]

trainer:
  epochs: 2
  max_steps: 32
  train_batch_size: 4
  policy_mini_batch_size: 4
  ckpt_path: ${oc.env:PIVOT_RUN_ROOT}/checkpoints
  callbacks:
    - type: evaluation
      eval_steps: 8
      eval_before_train: true
      eval_on_train_end: false
    - type: checkpoint
      save_steps: 8
      save_on_train_end: true
    - type: logging

generator:
  trajectory_retention:
    sample_count_per_step: 16
