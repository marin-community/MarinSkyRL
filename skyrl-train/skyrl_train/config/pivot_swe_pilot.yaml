defaults:
  - pivot_swe_smoke
  - _self_

trainer:
  max_steps: 1
  eval_num_prompts: 8
  train_batch_size: 16
  policy_mini_batch_size: 16
  callbacks:
    - type: evaluation
      eval_steps: 1
      eval_before_train: true
      eval_on_train_end: false
    - type: logging

generator:
  n_samples_per_prompt: 4
  trajectory_retention:
    sample_count_per_step: 64
