[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl-train"
version = "0.3.0"
description = "skyrl-train"
authors = [
    {name = "NovaSkyAI", email = "novasky.berkeley@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    # Capped below 5: transformers 5 is a breaking major (peft 0.17 cannot even import against it),
    # and the trainer is written against the 4.x API. The floor is vLLM 0.20.2's (>=4.56.0), so the
    # base and vllm environments agree on one transformers line.
    "transformers>=4.56.0,<5",
    "hydra-core==1.3.2",
    "accelerate",
    # Floor of 2.10 carries the torch-native context-parallel API
    # (torch.distributed.tensor.experimental.context_parallel + the ring-SDPA load balancer) that
    # the trainer needs. Production runs 2.11.0+cu130, which is what every extra now resolves to.
    "torch>=2.10.0",
    "torchdata",
    "omegaconf",
    "ray==2.51.1",
    "peft",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "flash-attn",
    "polars",
    "s3fs",
    "fastapi",
    "uvicorn",
]

[tool.uv]
required-version = ">=0.8.10"

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}

# flash-attn ships no static metadata: its sdist computes requires-dist at build time, and
# building it needs torch, which is the very thing `match-runtime` is trying to resolve. That
# circularity makes `uv lock` fail outright, which is why this lockfile had gone stale (it still
# pinned torch 2.8 against a tree that requires >=2.10). Declaring the metadata here is uv's
# supported way out: resolution reads these requirements instead of building the sdist, and the
# build itself is unaffected. Values are flash-attn's own install_requires.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym" , editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# We use `flashinfer-jit-cache` to avoid slow JIT compilation on first run.
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "extra == 'vllm'" }
# Expert-parallel / router-replay port (see notes/skyrl/fsdp2_ep_router_replay_port_plan.md).
# torchtitan is pure-python (provides @expert_parallel / ExpertParallel); it does NOT rebuild
# torch. Pin matches prime-rl (EP + grouped-GEMM + R3 validated there); compatible with our
# trainer torch 2.9.0 — Stage-0 dry-run confirmed it moves no protected package (torch/TE/
# transformers/numpy/flash-attn/mcore).
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
# deep-ep is the Stage-5 perf backend only. The prime-rl prebuilt wheel is x86_64; on aarch64
# (Jupiter/GH200) an aarch64-native build already exists in envs/rl, supplied out-of-band, so
# the URL below is inert there (gated by the marker on the `deepep` extra). x86_64-only.
deep-ep = { url = "https://github.com/PrimeIntellect-ai/prime-rl/releases/download/v0.5.0/deep_ep-1.2.1+29d31c0-cp312-cp312-linux_x86_64.whl" }

# vllm is the only inference extra. Three others (sglang, mcore, flashrl) used to sit here and
# none of them could be installed: each pinned a torch or transformers version that the base
# package's own requirements exclude, so `uv lock` had no solution at all and the lockfile had
# been stale since torch 2.7. sglang 0.5.13 requires transformers==5.8.1, which the trainer's 4.x
# API and peft cannot use; mcore pinned torch==2.9.1, held there by TransformerEngine; flashrl
# pinned torch==2.7.0 and is dead upstream (NovaSky-AI/SkyRL#1338). Production runs none of them:
# the RL SIF build recipe drops TransformerEngine outright ("production RL uses FSDP2 (not
# Megatron)"), which is what let that image reach torch 2.11 in the first place.
[project.optional-dependencies]
deepspeed = [
    "deepspeed==0.17.6"
]
dev = [
    "ruff==0.11.9",
    "black==24.10.0",
    "pytest>=6.2.5",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autobuild>=2021.3.14"
]
# TODO(tgriggs): Add `sandboxes` here once available as a package.
sandboxes = [
    "litellm[proxy]>=1.67.5",
]
# Stage-1 (FSDP2 CP port): the vllm extra is the actively-used inference path; its torch
# pin must carry torch-native context_parallel (>=2.10). Versions MIRROR the production SIF
# `skyrl_megatron_vllm0202rc0_r3.sif`, which runs the following resolved stack multi-node on
# Jupiter today: torch 2.11.0, vLLM 0.20.2rc0, flash-attn 2.6.3, torchvision 0.26.0.
# Torch comes from the cu130 index, matching that SIF. CUDA 13 wheels need an NVIDIA driver
# >= 580; the trainer already assumes this line (see distributed/utils.py, which parses
# "2.11.0+cu130").
# flash-attn is only needed for the NON-CP paths after Stage 2 (CP uses SDPA), so a slightly
# older 2.6.3 paired with torch 2.11 is fine.
vllm = [
    "vllm==0.20.2",
    "flash-attn==2.6.3",
    "torch==2.11.0",
    "flashinfer-python",
    "flashinfer-jit-cache",
    "torchvision==0.26.0"
]
miniswe = [
    # NOTE (sumanthrh): Needs to be a commit after https://github.com/SWE-agent/mini-swe-agent/commit/4f5d445e99d13b5482478c23508bf2fbf7c0670c
    "mini-swe-agent>=1.12.0",
    "litellm",
]
# Expert-parallel / router-replay port (Stage 0+). See notes/skyrl/fsdp2_ep_router_replay_port_plan.md.
# `ep` = the Stage-4 torch-backend EP floor (torchtitan only; no NVSHMEM, no deep-ep coupling).
# `deepep` = the Stage-5 perf backend (adds the platform-gated deep-ep wheel; inert on aarch64).
# Neither pins torch/vllm, so they are NOT added to [tool.uv].conflicts; the base install is
# unaffected and the no-EP default path needs neither extra.
ep = [
    "torchtitan",
]
deepep = [
    "torchtitan",
    "deep-ep ; platform_machine == 'x86_64'",
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skyrl_train*"]

[tool.setuptools.dynamic]
version = {attr = "skyrl_train.__version__"}
readme = {file = ["README.md"]}

# Ship default config files in the wheel
[tool.setuptools.package-data]
"skyrl_train" = ["config/**"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = [
    "tests",
]



[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722", # Syntax error in annotation - ignored because this doesn't play well with jaxtyping
    "E741", # Ambiguous variable names (l, I) - carried over from the flake8 config this replaces
]

[tool.ruff.lint.per-file-ignores]
# These modules put the repo root on sys.path so that `tests.*` resolves under a bare
# `python tests/gpu/...` invocation, so their imports necessarily follow that statement.
"tests/gpu/test_e2e_moe_rl_step.py" = ["E402"]
"tests/gpu/test_e2e_moe_rl_step_80b.py" = ["E402"]
# A skip guarding an optional dependency has to run before the import it guards.
"tests/cpu/distributed/test_muon_hybrid.py" = ["E402"]
"tests/cpu/generators/test_normalize_prompt_token_ids.py" = ["E402"]
"tests/cpu/models/test_moe_weight_remap.py" = ["E402"]
"tests/cpu/models/test_models.py" = ["E402"]
# Optional-dependency shim: the imports inside the try block are the availability probe.
"examples/terminal_bench/_harbor_compat.py" = ["F401"]

[pytest]
markers = [
    "vllm",
    "sglang",
    "integrations",
    "megatron",
]
