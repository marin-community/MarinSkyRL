[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl-train"
version = "0.3.0"
description = "skyrl-train"
authors = [
    {name = "NovaSkyAI", email = "novasky.berkeley@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    # transformers 5.8.x: required by the modern Megatron backend (megatron-bridge 0.5.0 pins
    # transformers>=5.8.1,<5.9.0), and co-resolvable with the whole stack — vLLM 0.23.0 requires
    # transformers>=5.5.3, and peft floats to 0.19.x. The trainer's import surface
    # is unchanged 4.57->5.8 (it already targets the 4.56/4.57 tail that adopted the 5.x-style API:
    # AttentionInterface, masking_utils, the per-model modeling refactors). Pinned to one 5.8.x line so
    # the fsdp2 and megatron backends train under an identical transformers.
    "transformers>=5.8.1,<5.9",
    "hydra-core==1.3.2",
    "accelerate",
    "torch>=2.10.0",
    "torchdata",
    "omegaconf",
    "ray==2.51.1",
    # peft 0.17 cannot import under transformers 5 (`ImportError: cannot import name 'HybridCache'`),
    # and peft is a top-level import (model_wrapper.py, fsdp_utils.py). 0.19 is the first line that
    # imports cleanly under transformers 5.8; also satisfies megatron-bridge 0.5.0's peft>=0.18.1.
    "peft>=0.19",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "flash-attn",
    "polars",
    "s3fs",
    "boto3",
    "smart_open",
    "fastapi",
    "uvicorn",
]

[tool.uv]
required-version = ">=0.8.10"

# Megatron CUDA build deps import the ambient torch at build time, so they cannot build under
# PEP-517 isolation. Only relevant on a from-source fallback (the lock resolves them from the
# prebuilt wheels in [tool.uv.sources]); belt-and-suspenders for the kaniko H100 build.
no-build-isolation-package = [
    "transformer-engine",
    "transformer-engine-torch",
]

# Megatron transitive pins that fight this tree's stack (scoped so the base/fsdp2 resolution is
# untouched):
#  - the transformer-engine meta package hardcodes the cu13 CUDA core; this image is CUDA 12.8, so
#    drop cu13 (transformer-engine-cu12 is added to the megatron extra instead).
#  - nvidia-resiliency-ext is an unpinned megatron-bridge transitive we do not use (sdist, CUDA).
override-dependencies = [
    "transformer-engine-cu13 ; sys_platform == 'never'",
    "nvidia-resiliency-ext ; sys_platform == 'never'",
    # boto/s3 ecosystem (linux gpu-rl image only) — FORCE the runtime-validated combo. Overrides,
    # not a plain pin, because the combo is METADATA-IMPOSSIBLE but RUNTIME-PROVEN: aiobotocore 3.7.0
    # declares `botocore<1.43.1`, yet the validated images run botocore 1.43.48 against it. A normal
    # resolve would walk botocore DOWN to <=1.43.0 to satisfy aiobotocore's bound — but botocore
    # <1.43.40 LACKS `botocore.docs.utils.DocumentModifiedShape` (added between 1.43.30 and 1.43.40),
    # so the cloud.iris controller-ingress bring-up sentinel
    # `from botocore.docs.utils import DocumentModifiedShape` ImportErrors on all ranks (killed the
    # tasktrove megatron RL launch keep1-v3). Versions are the EMPIRICAL `importlib.metadata` freeze
    # of the validated images (throwaway iris CPU pods, 2026-07-18):
    #   - botocore/boto3/s3transfer/aiobotocore = fullgate image `gpu-rl-e03896b7`@sha256:e8b48241 —
    #     the exact set keep1-v5 force-installed via the --boto-pin band-aid: sentinel PASS + rank-0
    #     s3 rendezvous PUT succeeded (fixed keep1-v4's `ClientArgsCreator.
    #     compute_endpoint_resolver_builtin_defaults() missing 3 positional args` aiobotocore<->botocore skew).
    #   - aiobotocore 3.7.0 + s3fs/fsspec 2026.4.0 also independently validated by the megatron image
    #     `gpu-rl-megatron-d41bb73d`@sha256:aa0e83c2 that banked gs1 (east18 parity run).
    # override-dependencies makes uv ignore every declared bound on these (aiobotocore's botocore cap,
    # s3fs's fsspec cap, datasets' fsspec cap), so the endpoints pin directly WITHOUT walking the
    # chain — datasets stays put (no datasets-5 / fsspec-2026 cascade). Marked linux because the RL
    # env is only ever built on the linux/x86_64 gpu-rl image; Mac dev resolves boto normally.
    "botocore==1.43.48 ; sys_platform == 'linux'",
    "boto3==1.43.48 ; sys_platform == 'linux'",
    "s3transfer==0.19.1 ; sys_platform == 'linux'",
    "aiobotocore==3.7.0 ; sys_platform == 'linux'",
    "s3fs==2026.4.0 ; sys_platform == 'linux'",
    "fsspec==2026.4.0 ; sys_platform == 'linux'",
    # The Marin vLLM fork accepts the already-validated 4.5.3 runtime. Stock vLLM
    # 0.23.0 is the resolver anchor but pins 4.5.2 exactly, so replace that one
    # requirement on the linux CUDA image without crossing the unvalidated 4.6
    # packaging boundary or activating the cu13 extra.
    "nvidia-cutlass-dsl>=4.5.2,<4.6 ; sys_platform == 'linux'",
    # The stock CUDA 13 wheel metadata activates humming-kernels[cu13]. The Marin
    # image is CUDA 12.8; the fork's setup.py performs the same cu13 -> cu12
    # translation when it builds its own wheel metadata.
    "humming-kernels[cu12]==0.1.4 ; sys_platform == 'linux'",
    # megatron-bridge 0.5.0 pins the older 0.6.8.post1 line, while the current
    # Marin vLLM fork requires 0.6.12. Both backends share one GPU-RL environment,
    # so the vLLM-compatible family is the environment-wide authority.
    "flashinfer-python==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.6.12 ; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]
# TransformerEngine's sdist builds its CUDA extension against the ambient torch (with build_tools +
# ninja). Only exercised on a from-source fallback; the lock uses the prebuilt wheels below.
transformer-engine = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]
transformer-engine-torch = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}

[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym" , editable = true }
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
flashinfer-jit-cache = { index = "flashinfer-cu128", marker = "extra == 'vllm'" }
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
deep-ep = { url = "https://github.com/PrimeIntellect-ai/prime-rl/releases/download/v0.5.0/deep_ep-1.2.1+29d31c0-cp312-cp312-linux_x86_64.whl" }
# Megatron backend (see the `megatron` extra). These are sdist-only on PyPI and build CUDA
# extensions against torch at install time (uv can't resolve their metadata on a non-CUDA host), so
# they resolve from prebuilt torch-2.11 / cu128 / cp312 / x86_64 wheels — the erictang000 forks
# upstream SkyRL's megatron extra also uses, matching the gpu-rl image ABI. x86_64-only (H100).
transformer-engine-torch = { url = "https://github.com/erictang000/TransformerEngine/releases/download/v2.11.0-torch2.11/transformer_engine_torch-2.11.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }
causal-conv1d = { url = "https://github.com/erictang000/causal-conv1d/releases/download/v1.6.1.post4-torch2.11/causal_conv1d-1.6.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }
mamba-ssm = { url = "https://github.com/erictang000/mamba/releases/download/v2.3.1-torch2.11/mamba_ssm-2.3.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }

[project.optional-dependencies]
deepspeed = [
    "deepspeed==0.17.6"
]
dev = [
    "ruff==0.11.9",
    "black==24.10.0",
    "pytest>=6.2.5",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autobuild>=2021.3.14"
]
sandboxes = [
    "litellm[proxy]>=1.67.5",
]
vllm = [
    "vllm==0.23.0",
    "flash-attn==2.8.3",
    "torch==2.11.0",
    "flashinfer-python==0.6.12",
    "flashinfer-cubin==0.6.12",
    "flashinfer-jit-cache==0.6.12",
    "torchvision==0.26.0"
]
miniswe = [
    "mini-swe-agent>=1.12.0",
    "litellm",
]
ep = [
    "torchtitan",
]
deepep = [
    "torchtitan",
    "deep-ep ; platform_machine == 'x86_64'",
]

# Megatron training backend — the alternative to the default FSDP2 policy trainer
# (skyrl_train/workers/megatron, built on megatron.bridge.AutoBridge). Isolated in its own extra so
# the default (fsdp2) install and CPU CI are unaffected; every dep is gated to linux/x86_64 (the
# CoreWeave H100 gpu-rl runtime), so the lock captures it there and it never builds on the Mac /
# aarch64. This is the MODERN Megatron line: megatron-bridge 0.5.0 + megatron-core 0.18.0, which
# requires transformers>=5.8.1 (why the base pin moved to 5.8.x) and torch>=2.6 (torch stays on the
# base/vllm 2.11 line). transformer-engine-torch / mamba-ssm / causal-conv1d are sdist-only on PyPI
# and resolve from prebuilt cu128 wheels (see [tool.uv.sources]); TE's CUDA core is overridden from
# cu13 to cu12 to match the cu128 runtime (see [tool.uv] override-dependencies).
megatron = [
    "megatron-bridge==0.5.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # 0.18.0 (not 0.18.1 — 0.18.1 is yanked on PyPI, "wrong version"); highest non-yanked with cp312 wheels.
    "megatron-core==0.18.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformer-engine[pytorch]==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Declared directly (not just via transformer-engine[pytorch]) so the [tool.uv.sources] URL is
    # honored — uv ignores sources for transitive-only packages.
    "transformer-engine-torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # cu12 CUDA core to match the cu128 runtime (cu13 core overridden to `never`).
    "transformer-engine-cu12==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # GDN / Mamba-hybrid kernels (Qwen3-Next, Qwen3.6-35B-A3B) under megatron.
    "mamba-ssm>=2.2,<3 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "causal-conv1d>=1.5,<2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flash-linear-attention ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-modelopt ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu128"
url = "https://flashinfer.ai/whl/cu128"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skyrl_train*"]

[tool.setuptools.dynamic]
version = {attr = "skyrl_train.__version__"}
readme = {file = ["README.md"]}

[tool.setuptools.package-data]
"skyrl_train" = ["config/**"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = [
    "tests",
]



[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/gpu/test_e2e_moe_rl_step.py" = ["E402"]
"tests/gpu/test_e2e_moe_rl_step_80b.py" = ["E402"]
"tests/cpu/distributed/test_muon_hybrid.py" = ["E402"]
"tests/cpu/generators/test_normalize_prompt_token_ids.py" = ["E402"]
"tests/cpu/models/test_moe_weight_remap.py" = ["E402"]
"tests/cpu/models/test_models.py" = ["E402"]
"examples/terminal_bench/_harbor_compat.py" = ["F401"]

[pytest]
markers = [
    "vllm",
    "sglang",
    "integrations",
    "megatron",
]
