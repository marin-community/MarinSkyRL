[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marinskyrl-launcher"
version = "0.1.0"
description = "Launch-host contract for MarinSkyRL Iris training"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fsspec>=2024.0.0",
    "huggingface-hub>=0.34.0",
    "marin-iris==0.2.54.dev202607210800",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
agentic = ["daytona>=0.92.0"]
test = ["pytest>=8.4"]

[project.scripts]
marinskyrl = "cloud.iris.artifact_protocol:main"

[tool.hatch.build.targets.wheel.force-include]
"../cloud/iris" = "cloud/iris"

[tool.uv]
package = true
