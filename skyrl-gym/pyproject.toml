[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl-gym"
version = "0.1.1"
description = "Task sessions and graders for LLM reinforcement learning."
authors = [
    { name = "NovaSkyAI AI Team"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "marin-rolloutengine @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/rolloutengine",
    "marin-shellbox @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/shellbox",
    "taskcompendium @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/taskcompendium",
    "verifyit[answer,schema,reasoning-gym,judge] @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/verifyit",
    "func_timeout",
    "loguru",
    "numpy",
    "pandas",
    "pydantic>=2.12,<3",
    "requests",
    "omegaconf",
    "openapi-schema-validator",
    "math-verify==0.9.0",
    "reasoning-gym==0.1.25",
    "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
    "xmltodict",
]

[project.urls]
Repository = "https://github.com/NovaSky-AI/SkyRL"

[tool.setuptools.packages.find]
include = ["skyrl_gym*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "psutil",
    "ipython==9.6.0",
]

[tool.ruff]
line-length = 120

[tool.uv]
# Select a published package instead of the enclosing Git workspace.
override-dependencies = ["marin-rigging>=0.2.144.dev37540375919"]

[tool.ruff.lint]
ignore = [
    "F722"
]

[tool.pytest.ini_options]
addopts = "-m 'not docker'"
markers = ["docker: local Docker execution; run explicitly in the container test lane"]
