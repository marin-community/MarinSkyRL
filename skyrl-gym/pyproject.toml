[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl-gym"
version = "0.1.1"
description = "RL environments for LLMs implemented with the Gymnasium API."
authors = [
    { name = "NovaSkyAI AI Team"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "verifyit[answer,schema,reasoning-gym,judge] @ git+https://github.com/marin-community/verifyit@b08a5ee8d94fcb4a2134562aee94ff9715dadd14",
    "func_timeout",
    "loguru",
    "numpy",
    "pandas",
    "requests",
    "omegaconf",
    "openapi-schema-validator",
    "math-verify==0.9.0",
    "reasoning-gym==0.1.25",
    "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
    "xmltodict",
]

[project.urls]
Repository = "https://github.com/NovaSky-AI/SkyRL"

[tool.setuptools.package-data]
"skyrl_gym.envs.nemotron_ultra" = ["abstention_prompt.txt", "jailbreak_verifiers.yaml"]

[tool.setuptools.packages.find]
include = ["skyrl_gym*"]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722"
]
