# Disposable 4-node Megatron sender + 1-node DP8/EP8 vLLM receiver geometry.
# The extra data-parallel copy leaves room for GPU Adam and a prior-weight baseline.
# The --entrypoint override runs the experiment module, which owns its measurements.
entrypoint: standard

context_budget:
  request_window_tokens: 64
  max_new_tokens_per_turn: 8
  max_turns: 1

environment:
  env_class: gsm8k

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  gradient_checkpointing: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
  epochs: 1
  max_steps: 2
  update_epochs_per_batch: 1
  train_batch_size: 32
  policy_mini_batch_size: 32
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: 100
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      optimizer_checkpoint_sharding_type: dp_reshardable
      ddp_config:
        overlap_grad_reduce: true
        overlap_param_gather: false
        grad_reduce_in_fp32: false
      optimizer_config_kwargs:
        optimizer_cpu_offload: false
        optimizer_offload_fraction: 0.0
  placement:
    colocate_all: false
    policy_num_nodes: 4
    policy_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 1
  n_samples_per_prompt: 1
  gpu_memory_utilization: 0.5
  enforce_eager: true
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  sampling_params:
    temperature: 0.0

data:
  kind: parquet
  train_data: []
  val_data: []

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
