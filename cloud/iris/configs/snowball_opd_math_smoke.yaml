# Snowball 67B-A2B single-teacher on-policy distillation smoke: the Megatron smoke geometry
# (four PP2 x EP8 learner nodes, one EP8 rollout node) plus one pinned EP8 teacher node
# scoring chosen tokens with sampled reverse KL. Six H100 nodes. Two optimizer steps on
# GSM8K at 512-token generations; the gate is finite distillation loss, teacher-scored
# tokens, a positive raw gradient norm, and one checkpoint, not a benchmark score.
#
# Pass the student with --model-path (open-athena/Snowball-67B-A2B-10T-Mixed-RLVR-Sync-Step92
# pinned to a commit) and SkyRL-shaped GSM8K parquet with --train-data. The teacher is pinned
# below; the launcher pre-stages it into the region-local Hugging Face cache before Ray starts.
entrypoint: standard

context_budget:
  request_window_tokens: 2048
  max_new_tokens_per_turn: 512
  max_turns: 1

environment:
  env_class: gsm8k

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  offload_optimizer_during_rollouts: true
  gradient_checkpointing: true
  algorithm:
    # The distillation term replaces the reward-driven loss; the uniform estimator leaves
    # the per-token teacher gap as the only advantage.
    advantage_estimator: uniform
    use_kl_loss: false
    use_entropy_loss: false
    loss_reduction: token_mean
    distillation:
      objective: sampled_reverse_kl
      routing_plan: opd
      coefficient: 1.0
      reward_mode: replace
  epochs: 1
  max_steps: 2
  update_epochs_per_batch: 1
  train_batch_size: 32
  policy_mini_batch_size: 32
  eval_batch_size: 64
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: 2
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      optimizer_checkpoint_sharding_type: dp_reshardable
  placement:
    colocate_all: false
    policy_num_nodes: 4
    policy_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 1
  n_samples_per_prompt: 4
  gpu_memory_utilization: 0.75
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  sampling_params:
    temperature: 1.0
    top_p: 1.0

# The vLLM fork serves GrugMoE only as tensor-parallel 1 with expert parallelism across
# the data-parallel ranks, so the teacher takes the rollout engine's layout on its own node.
teachers:
  math:
    source: local_inference
    placement: pinned
    backend: vllm
    evidence: chosen_token
    model:
      path: open-athena/Snowball-67B-A2B-Math-RL-E6-Step20-Repaired
      revision: f8c394b378247d213e9b2d4768f13a47c81a41b7
    resources:
      num_nodes: 1
      gpus_per_node: 8
      tensor_parallel_size: 1
      data_parallel_size: 8
      expert_parallel_size: 8
      colocation_group: teacher_math
      gpu_memory_utilization: 0.75

teacher_routing:
  opd:
    revision: snowball-opd-math-smoke-v1
    routes:
      default:
        teacher: math
        weight: 1.0

data:
  kind: parquet
  train_data: []
  val_data: []

# Not HF_HUB_OFFLINE: Megatron Bridge resolves a Hub model id through refs/main, which the
# warm-synced node cache does not carry, so the Megatron policy worker fails offline. The
# launcher pre-stages the teacher from the region cache in either mode.
extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
