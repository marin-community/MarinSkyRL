# Snowball 67B-A2B three-teacher on-policy distillation at a 32K window on a blend-proportional
# sample of NVIDIA's Nemotron Ultra MOPD blend. Nine H100 nodes: four PP2 x EP8 learner
# nodes, two EP8 rollout nodes, and one pinned EP8 teacher node per Snowball expert.
#
# The sample (infra/rl_data/nemotron_ultra_mopd_subset.py --rows) routes every generator of the
# blend, so rows keep their teacher_route column and the stock shuffle preserves the blend's mix;
# --swe-rows 0 leaves out the Harbor SWE agent's rows.
# grading: skip lets judge-backed rows train without a judge; the distillation loss ignores the
# reward. ns_tools and Lean rows execute in the in-cluster NeMo Skills sandbox. Build the sample
# with --swe-rows 0. Harbor SWE rows need a launch with controller ingress, so the Daytona
# sandbox can reach the rollout engines, and are validated separately.
#
# Pass the student with --model-path (open-athena/Snowball-67B-A2B-10T-Mixed-RLVR-Sync-Step92
# pinned to a commit) and the sample's train.parquet with --train-data.
defaults:
- base/snowball_mopd_ultra_32k@_global_
- _self_

# The vLLM fork serves GrugMoE only as tensor-parallel 1 with expert parallelism across the
# data-parallel ranks. Each teacher prefills whole 32K sequences with prompt log-probs, so it
# gets the rollout engines' batched-token cap.
teachers:
  math:
    source: local_inference
    placement: pinned
    backend: vllm
    evidence: chosen_token
    model:
      path: open-athena/Snowball-67B-A2B-Math-RL-E6-Step20-Repaired
      revision: f8c394b378247d213e9b2d4768f13a47c81a41b7
    resources:
      num_nodes: 1
      gpus_per_node: 8
      tensor_parallel_size: 1
      data_parallel_size: 8
      expert_parallel_size: 8
      colocation_group: teacher_math
      gpu_memory_utilization: 0.8
      max_num_batched_tokens: 16384
  swe:
    source: local_inference
    placement: pinned
    backend: vllm
    evidence: chosen_token
    model:
      path: laion/snowball-67b-a2b-rl-r2egym-newstack-step24
      revision: cb75292c0e98fd66a8c50b482717bd35b664bed9
    resources:
      num_nodes: 1
      gpus_per_node: 8
      tensor_parallel_size: 1
      data_parallel_size: 8
      expert_parallel_size: 8
      colocation_group: teacher_swe
      gpu_memory_utilization: 0.8
      max_num_batched_tokens: 16384
  terminal:
    source: local_inference
    placement: pinned
    backend: vllm
    evidence: chosen_token
    model:
      path: laion/snowball-67b-a2b-sft-s3-nemotron-terminal-step1888
      revision: 680bec3ade494b61ead6861fa24fc4071f8dc294
    resources:
      num_nodes: 1
      gpus_per_node: 8
      tensor_parallel_size: 1
      data_parallel_size: 8
      expert_parallel_size: 8
      colocation_group: teacher_terminal
      gpu_memory_utilization: 0.8
      max_num_batched_tokens: 16384

teacher_routing:
  opd:
    revision: snowball-mopd-ultra-32k-v1
    routes:
      math:
        teacher: math
        weight: 1.0
      swe:
        teacher: swe
        weight: 1.0
      terminal:
        teacher: terminal
        weight: 1.0
