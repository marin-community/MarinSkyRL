# Snowball 67B-A2B with an online EAGLE-3 draft on GSM8K. The policy uses four
# PP2 x EP8 Megatron nodes; one DP8/EP8 vLLM node serves and trains the draft.
# The exact target revision is supplied to the launcher, while the immutable
# public draft is staged from Hugging Face. This qualification configuration
# requires one finite draft decision and install after every policy update.
entrypoint: standard

context_budget:
  request_window_tokens: 2048
  max_new_tokens_per_turn: 512
  max_turns: 1

environment:
  env_class: gsm8k

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  offload_optimizer_during_rollouts: true
  gradient_checkpointing: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
  epochs: 1
  max_steps: 25
  update_epochs_per_batch: 1
  train_batch_size: 32
  policy_mini_batch_size: 32
  eval_batch_size: 64
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: 5
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  placement:
    colocate_all: false
    policy_num_nodes: 4
    policy_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 1
  n_samples_per_prompt: 4
  gpu_memory_utilization: 0.75
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  speculative_decoding:
    method: eagle3
    model:
      path: /tmp/marinskyrl-models/snowball-64k-eagle3-draft-r2egym
      source_uri: hf://laion/snowball-64k-eagle3-draft-r2egym
      source_identity: 4bdb47c08e5b5190bea3c7a93c3e14470230e469
    num_speculative_tokens: 3
    training:
      interval_steps: 1
      max_tokens_per_update: 32768
      max_sequences_per_prompt_group: 2
      min_train_sequences: 8
      holdout_fraction: 0.25
      min_holdout_sequences: 4
      epochs_per_update: 1
      learning_rate: 5.0e-5
      max_validation_loss_increase: 0.05
      max_validation_agreement_decrease: 0.01
      boundary_wait_seconds: 30
      trainer_rank: 0
      reserved_gpu_memory_gib: 8
  sampling_params:
    temperature: 1.0
    top_p: 1.0

data:
  kind: parquet
  train_data: []
  val_data: []

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
