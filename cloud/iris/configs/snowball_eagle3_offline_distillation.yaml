# Capture long-form Snowball verifier features on 64 H100s, then reuse one
# released rollout GPU for a bounded EAGLE-3 update.
entrypoint: generate

context_budget:
  request_window_tokens: 9856
  max_new_tokens_per_turn: 8192
  max_turns: 1

environment:
  env_class: aime

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
  train_batch_size: 64
  policy_mini_batch_size: 64
  # Queue the bounded capture corpus at once so long-output stragglers do not
  # drain the 64-way rollout pool at every host-side evaluation batch boundary.
  eval_batch_size: 1200
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  logger: console
  project_name: snowball-eagle3-offline-distillation
  placement:
    colocate_all: false
    policy_num_nodes: 1
    policy_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_pipeline_parallel_size: 1
  inference_engine_data_parallel_size: 64
  inference_engine_expert_parallel_size: 64
  num_inference_engines: 1
  n_samples_per_prompt: 16
  eval_n_samples_per_prompt: 4
  gpu_memory_utilization: 0.75
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  engine_init_kwargs:
    async_scheduling: false
  speculative_decoding:
    method: eagle3
    model:
      source_uri: hf://laion/snowball-64k-eagle3-draft-r2egym
      source_identity: 4bdb47c08e5b5190bea3c7a93c3e14470230e469
    num_speculative_tokens: 3
    training:
      interval_steps: 1
      max_tokens_per_update: 1000000
      max_window_tokens: 16384
      max_tokens_per_micro_batch: 8192
      max_sequences_per_prompt_group: 2
      min_train_sequences: 32
      holdout_fraction: 0.1
      min_holdout_sequences: 16
      epochs_per_update: 4
      optimizer: hybrid_muon
      learning_rate: 1.0e-5
      muon_learning_rate: 0.02
      max_validation_loss_increase: 0.05
      max_validation_agreement_decrease: 0.01
      reserved_gpu_memory_gib: 12
  sampling_params:
    temperature: 1.0
    top_p: 1.0
  eval_sampling_params:
    temperature: 1.0
    top_p: 1.0

data:
  kind: parquet
  train_data: []
  val_data: []
  shuffle: false

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
