# Daytona-free asynchronous smoke for weight-sync pause behavior on two H100x8 nodes.
# Run separate attempts with generator.weight_sync_pause.mode=abort and keep.
entrypoint: gym_worker_pool

context_budget:
  request_window_tokens: 2048
  max_new_tokens_per_turn: 512
  max_turns: 1

environment:
  env_class: gsm8k

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  gradient_checkpointing: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
    policy_loss_type: behavior_clip
  epochs: 1
  max_steps: 3
  update_epochs_per_batch: 1
  train_batch_size: 8
  policy_mini_batch_size: 8
  eval_batch_size: 8
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: -1
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      optimizer_checkpoint_sharding_type: dp_reshardable
  placement:
    colocate_all: false
    policy_num_nodes: 1
    policy_num_gpus_per_node: 8
  project_name: vllm-pause-policy
  rollout_buffer:
    max_staleness_steps: 1
    batch_policy: full_batch
    max_in_flight: 16

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 1
  inference_engine_expert_parallel_size: 1
  num_inference_engines: 8
  n_samples_per_prompt: 2
  gpu_memory_utilization: 0.7
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  weight_sync_pause:
    mode: abort
    clear_cache: true
  sampling_params:
    temperature: 1.0
    top_p: 1.0

data:
  kind: parquet
  train_data:
    - ci/pause_policy_smoke/train.jsonl
  val_data:
    - ci/pause_policy_smoke/validation.jsonl

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
