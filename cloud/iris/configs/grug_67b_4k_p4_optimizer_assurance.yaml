entrypoint: skyrl_train.entrypoints.main_base

context_budget:
  request_window_tokens: 4096
  max_new_tokens_per_turn: 2560
  max_turns: 1

model_num_attention_heads: 20

environment:
  env_class: aime

trainer:
  strategy: fsdp2

  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
    use_entropy_loss: false
    eps_clip_low: 0.2
    eps_clip_high: 0.2

  epochs: 1
  max_steps: 5
  ckpt_interval: 2

  train_batch_size: 256
  policy_mini_batch_size: 256
  eval_batch_size: 256
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1

  use_sample_packing: false
  flash_attn: false
  attn_backend: "auto"
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false

  eval_before_train: false
  eval_interval: 0

  project_name: snowball_67b_a2b_rl_7786
  logger: wandb

  policy:
    optimizer_config:
      lr: 1.0e-5
      max_grad_norm: 0.5
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true

  placement:
    colocate_all: false
    policy_num_nodes: 4
    policy_num_gpus_per_node: 8
    policy_strict_spread_pg: true
    policy_per_gpu_bundles: true

generator:
  backend: vllm
  model_dtype: bfloat16

  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 2
  n_samples_per_prompt: 16

  gpu_memory_utilization: 0.85
  enforce_eager: false
  max_num_batched_tokens: 8192

  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true

extra_env:
  HF_HUB_OFFLINE: "1"
  NCCL_SOCKET_IFNAME: "^ibs,ibp,lo,docker,veth,cilium,lxc"

data:
  kind: parquet
  train_data: []
  val_data: []
