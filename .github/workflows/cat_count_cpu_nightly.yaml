name: CatCount CPU nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-count-cpu-nightly
  cancel-in-progress: true

jobs:
  cat_count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install CPU trainer
        run: uv sync --frozen --group dev --group harbor-test --extra cpu --extra telemetry
      - uses: actions/cache@v5
        with:
          path: .pytest_cache/d/cat_count_policy
          key: cat-count-policy-${{ runner.os }}-${{ hashFiles('skyrl-train/examples/cat_count/cpu_canary.py', 'skyrl-gym/skyrl_gym/envs/cat_count/reward.py', 'skyrl-train/tests/cpu/test_cat_count_cpu_canary.py', 'pyproject.toml', 'skyrl-gym/pyproject.toml', 'uv.lock') }}
      - name: Check three learning seeds, async learning and checkpoint resume
        env:
          PYTHONPATH: ${{ github.workspace }}/skyrl-train:${{ github.workspace }}/skyrl-gym
        run: uv run --frozen pytest skyrl-train/tests/cpu/test_cat_count_cpu_canary.py -m slow -n 0 -s --durations=10
