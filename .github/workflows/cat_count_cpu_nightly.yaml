name: CatCount CPU nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-count-cpu-nightly
  cancel-in-progress: true

jobs:
  cat_count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install CPU trainer
        run: uv sync --frozen --group dev --group harbor-test --extra cpu --extra telemetry
      - name: Measure the CatCount PR selection
        env:
          PYTHONPATH: ${{ github.workspace }}/skyrl-train:${{ github.workspace }}/skyrl-gym
        run: uv run --frozen pytest skyrl-train/tests/cpu/test_cat_count_cpu_canary.py -m "not nightly" -n 0 -s --durations=10
