name: Build Axolotl Tinker SFT image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GCP_PROJECT: hai-gcp-models
  IRIS_CLIENT_REQUIREMENT: marin-core>=0.2.46.dev202607131620
  WIF_PROVIDER: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_NAME: marinskyrl-axolotl-tinker-sft-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Install the Iris client
        run: uv tool install --prerelease allow "$IRIS_CLIENT_REQUIREMENT"

      - name: Build the revision-addressed image on Iris
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$(uv tool dir)/marin-core/bin/iris" --cluster marin job run \
            --target-cluster cw-rno2a \
            --job-name "$JOB_NAME" \
            --task-image docker.io/library/ubuntu:22.04 \
            --cpu 48 --memory 512GB --disk 400GB \
            --priority interactive --no-preemptible --max-retries 0 \
            --timeout 5400 --no-sync --enable-extra-resources \
            -e GITSHA "$GITHUB_SHA" \
            -e REGISTRY_USER "$GITHUB_ACTOR" \
            -e REGISTRY_TOKEN "$REGISTRY_TOKEN" \
            -- bash docker/build_axolotl_tinker_sft_kaniko.sh

      - name: Cancel any Iris job left behind
        if: always()
        run: >-
          "$(uv tool dir)/marin-core/bin/iris" --cluster marin job cancel
          "/runner/$JOB_NAME" || true
