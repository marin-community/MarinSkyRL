name: SkyRL

on:
  push:
    branches:
      - main
      - rc/**
  pull_request:

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Lint and format
        run: uv run infra/pre-commit.py --all-files
      - name: Check the vendored marin-style tree is current
        run: uvx --from git+https://github.com/marin-community/marin-style@727f180cd423246ca1a6164163a5883cda5bf52b marin-style sync --check
      - name: Secret scan
        run: uv run --with pre-commit pre-commit run gitleaks --all-files --config .pre-commit-config.yaml

  infra_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install the development environment
        run: uv sync --frozen --group dev
      - name: Run infra tests
        run: uv run --frozen pytest infra/tests/ -q

  iris_launcher_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install the CPU-only launcher
        run: uv sync --frozen --group dev
      - name: Exercise the Iris CLI dependency boundary
        run: uv run --frozen iris --help
      - name: Run iris launcher tests
        run: uv run --frozen pytest cloud/iris/tests/ -q
      - name: Verify the base dependency boundary
        run: uv run --frozen pytest infra/tests/test_marinskyrl_packaging.py -q
      - name: Exercise a clean built-wheel install
        run: |
          uv build --wheel --out-dir dist
          uv venv --python 3.12 /tmp/marinskyrl-base
          uv pip install --python /tmp/marinskyrl-base/bin/python dist/marinskyrl-*.whl
          cd /tmp
          /tmp/marinskyrl-base/bin/marinskyrl --help

  skyrl_train_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Check the macOS CPU environment resolves
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: uv sync --frozen --dry-run --group dev --extra cpu --python-platform aarch64-apple-darwin
      - name: Install skyrl-train
        run: uv sync --frozen --group dev --group harbor-test --extra cpu --extra telemetry
      - name: Check the lockfile is current
        run: uv lock --check
      - uses: actions/cache@v5
        with:
          path: .pytest_cache/d/cat_count_policy
          key: cat-count-policy-${{ runner.os }}-${{ hashFiles('skyrl-train/examples/cat_count/cpu_canary.py', 'skyrl-gym/skyrl_gym/envs/cat_count/reward.py', 'skyrl-train/tests/cpu/test_cat_count_cpu_canary.py', 'pyproject.toml', 'skyrl-gym/pyproject.toml', 'uv.lock') }}
      - name: Run cpu tests
        env:
          PYTHONPATH: ${{ github.workspace }}/skyrl-train:${{ github.workspace }}/skyrl-gym
        run: uv run --frozen pytest skyrl-train/tests/cpu/ -m "not slow and not nightly" -n auto --dist loadgroup
      - name: Run existing Ray training tests serially
        env:
          PYTHONPATH: ${{ github.workspace }}/skyrl-train:${{ github.workspace }}/skyrl-gym
        run: |
          nproc
          uv run --frozen pytest skyrl-train/tests/cpu/ --ignore=skyrl-train/tests/cpu/test_cat_count_cpu_canary.py -m "slow and not nightly" -n 0
      - name: Check CatCount learning on seed 0
        env:
          PYTHONPATH: ${{ github.workspace }}/skyrl-train:${{ github.workspace }}/skyrl-gym
        run: uv run --frozen pytest skyrl-train/tests/cpu/test_cat_count_cpu_canary.py -m "not nightly" -n 0 -s --durations=10

  skyrl_train_macos_install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install skyrl-train
        run: uv sync --frozen --group dev --extra cpu
      - name: Exercise macOS operator entrypoints
        run: |
          uv run --frozen python -c "import boto3, botocore, s3fs"
          uv run --frozen python -c "from connectrpc._client_sync import SyncClient; SyncClient()"
          uv run --frozen iris --help
          uv run --frozen python scripts/iris/watch_coreweave_rl.py --help
      - name: Exercise local filesystem I/O
        run: uv run --frozen pytest skyrl-train/tests/cpu/utils/test_io.py

  skyrl_gym_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./skyrl-gym
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Install skyrl-gym
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run cpu tests with the real NeMo sandbox
        run: |
          sandbox_dir="$(mktemp -d)"
          sandbox_pid=""
          cleanup() {
            if [[ -n "$sandbox_pid" ]]; then kill -- -"$sandbox_pid" 2>/dev/null || true; fi
            rm -rf "$sandbox_dir"
          }
          trap cleanup EXIT
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/NVIDIA-NeMo/Skills/bcf059af55c20a89f797724598f9908d126153e6/nemo_skills/code_execution/local_sandbox/local_sandbox_server.py \
            --output "$sandbox_dir/server.py"
          echo "c79197dc02e33b63b58b30783e3cfe0076e8edf6ceb409835b5d0762756b621d  $sandbox_dir/server.py" | sha256sum --check
          uv venv --python 3.12 "$sandbox_dir/venv"
          uv pip install --python "$sandbox_dir/venv/bin/python" Flask==3.1.2 ipython==9.6.0 psutil==7.1.0 numpy==2.2.6 pandas==2.3.0
          setsid "$sandbox_dir/venv/bin/python" "$sandbox_dir/server.py" > "$sandbox_dir/server.log" 2>&1 &
          sandbox_pid=$!
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:6000/health; then ready=true; break; fi
            if ! kill -0 "$sandbox_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat "$sandbox_dir/server.log"; exit 1; fi
          if ! uv run --frozen --python 3.12 pytest tests/; then cat "$sandbox_dir/server.log"; exit 1; fi
