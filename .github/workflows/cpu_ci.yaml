name: SkyRL

on:
  push:
    branches:
      - main
      - rc/**
  pull_request:

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Lint and format
        run: uv run infra/pre-commit.py --all-files
      - name: Check the vendored marin-style tree is current
        run: uvx --from git+https://github.com/marin-community/marin-style@ccbf03e7ca58486d61fff7a4e73031673d7fd8a4 marin-style sync --check
      - name: Secret scan
        run: uv run --with pre-commit pre-commit run gitleaks --all-files --config .pre-commit-config.yaml

  infra_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Run infra tests
        run: uv run --no-project --with pytest pytest infra/tests/ -q

  iris_launcher_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Run iris launcher tests
        run: |
          uv run --no-project \
            --with pytest --with pyyaml --with fsspec --with huggingface_hub --with universal-pathlib \
            pytest cloud/iris/tests/ -q

  skyrl_train_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./skyrl-train
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Check the macOS CPU environment resolves
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: uv sync --frozen --dry-run --extra dev --python-platform aarch64-apple-darwin
      - name: Install skyrl-train
        run: uv sync --frozen --extra dev
      - name: Check the lockfile is current
        run: uv lock --check
      - name: Run cpu tests
        run: |
          uv run --frozen pytest tests/cpu/ \
            --deselect tests/cpu/distributed/test_cp_config.py::test_all_defaults_is_structurally_identical_to_pre_cp \
            --deselect tests/cpu/generators/test_skyrl_gym_generator.py::test_generator_output_concatenation \
            --deselect tests/cpu/inf_engines/test_inference_engine_client.py::test_generate_retry_no_gen_finish \
            --deselect tests/cpu/test_ep_config_noop.py::test_all_defaults_is_structurally_identical_to_pre_ep \
            --deselect tests/cpu/test_trainer.py::test_ppo_train_batch_calculations

  skyrl_gym_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./skyrl-gym
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Install skyrl-gym
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run cpu tests
        run: uv run --frozen --python 3.12 pytest tests/
