name: Marin Nightly E2E

# The real end-to-end gate: a single-H100 GRPO run on GSM8K, submitted to the Marin/Iris
# cluster and scored against a checked-in spec. skyrl-train/ci/marin_nightly/run_h100.sh is
# what actually runs on the GPU; this workflow provisions it and tears it down.
#
# Runs on a hosted runner and reaches the cluster over GCP. Auth is keyless via Workload
# Identity Federation: the job's GitHub OIDC token (permissions.id-token: write) is
# exchanged to impersonate github-iris@hai-gcp-models -- no stored service-account key.
#
# CoreWeave's Iris controllers are IP-locked to the Marin egress, so a hosted runner cannot
# reach them directly. The job is submitted to the `marin` cluster and federated to
# CoreWeave with --target-cluster, which is the supported route from CI.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC, staggered off the other Marin nightlies
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id to train"
        default: Qwen/Qwen3-0.6B
      max_steps:
        description: "Training steps to run"
        default: "30"
      target_cluster:
        description: "Iris cluster to federate the job to"
        default: cw-rno2a

concurrency:
  group: marin-nightly
  cancel-in-progress: false   # never interrupt a run holding an H100

jobs:
  gsm8k-h100:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write   # mint the OIDC token that WIF exchanges for github-iris
    env:
      JOB_NAME: marinskyrl-nightly-gsm8k
      TARGET_CLUSTER: ${{ github.event.inputs.target_cluster || 'cw-rno2a' }}
    steps:
      - uses: actions/checkout@v4

      - name: Trim the Iris bundle
        # iris bundles the working directory by enumerating `git ls-files`, and caps the zip
        # at 25MB. The tracked tree is ~25MB raw, most of it docs images (two 5.5MB SVGs) and
        # the dormant skyrl-agent package -- none of which the training job reads. Dropping
        # them from the index keeps the bundle comfortably under the cap. The checkout is
        # throwaway, so this never touches anything real.
        run: git rm -r --cached --quiet skyrl-train/docs skyrl-agent

      - uses: astral-sh/setup-uv@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: hai-gcp-models

      - name: Install the iris client
        # marin-core depends on marin-iris but uv only symlinks the named package's own
        # scripts, so the tool's bin dir goes on PATH to make `iris` resolve. The floor is the
        # first build carrying the WIF/IAP auth fix (marin#7144).
        run: |
          uv tool install --prerelease allow "marin-core>=0.2.46.dev202607131620"
          echo "$(uv tool dir)/marin-core/bin" >> "$GITHUB_PATH"

      - name: Train and gate on one H100
        # --gpu is gated behind --enable-extra-resources by iris. --no-sync stops iris from
        # syncing the repo root (a metadata-only package); run_h100.sh syncs skyrl-train
        # itself. `iris job run` blocks, streams the job's logs, and exits non-zero unless the
        # job succeeded -- so the gate's exit code inside the job is this step's exit code.
        run: |
          iris --cluster marin job run \
            --target-cluster "$TARGET_CLUSTER" \
            --job-name "$JOB_NAME" \
            --gpu H100x1 --enable-extra-resources \
            --cpu 8 --memory 64GB --disk 200GB \
            --no-sync \
            --timeout 5400 \
            -e MODEL "${{ github.event.inputs.model || 'Qwen/Qwen3-0.6B' }}" \
            -e MAX_STEPS "${{ github.event.inputs.max_steps || '30' }}" \
            -- bash skyrl-train/ci/marin_nightly/run_h100.sh 2>&1 | tee nightly.log

      - name: Stop any Iris job the run left behind
        if: always()
        # `iris job run` stops its job when it exits, and --timeout is a server-side backstop,
        # so this only matters if the runner was hard-killed. --cluster is a top-level flag.
        run: iris --cluster marin job stop "$JOB_NAME" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-run-log
          path: nightly.log
          if-no-files-found: ignore

  # Failure reporting: file or update the [nightly-gsm8k-h100] tracking issue, ask
  # weaverbot to triage (launches a weaver session), and ping Slack. The trigger
  # and Slack channels each skip with a notice until the LOOM_TRIGGER_GH_TOKEN /
  # SLACK_WEBHOOK_URL org secrets are provisioned; the issue trail accrues either way.
  report-failure:
    needs: [gsm8k-h100]
    # cancelled matters: a job that hits its timeout-minutes reports cancelled, not failure
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write    # file/update the tracking issue
      actions: read    # pull failed-job logs for the excerpt
      contents: read
    steps:
      - uses: marin-community/marin-style/actions/report-failure@ccbf03e7ca58486d61fff7a4e73031673d7fd8a4  # v0.3.0
        with:
          lane: gsm8k-h100
          trigger-token: ${{ secrets.LOOM_TRIGGER_GH_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          triage-notes: >-
            The nightly runs single-H100 GRPO via a WIF-authenticated Iris job on the
            CoreWeave cluster. Separate Iris/cluster failures from training regressions.
