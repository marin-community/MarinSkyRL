name: Marin Nightly E2E


on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id to train"
        default: Qwen/Qwen3-0.6B
      max_steps:
        description: "Training steps to run"
        default: "30"
      strategy:
        description: "Training backend for the GSM8K lane (fsdp2 or megatron)"
        default: fsdp2
      target_cluster:
        description: "Iris cluster to federate the job to"
        default: cw-rno2a
      grug_target_cluster:
        description: "ARM64 Iris cluster for the Marin vLLM Grug gate"
        default: cw-us-east-08a

concurrency:
  group: marin-nightly
  cancel-in-progress: false

env:
  GCP_PROJECT: hai-gcp-models
  IRIS_CLIENT_REQUIREMENT: marin-core>=0.2.46.dev202607131620
  WIF_PROVIDER: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc

jobs:
  gpu-gate:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: gsm8k-h100
            target_cluster: ${{ github.event.inputs.target_cluster || 'cw-rno2a' }}
            gpu: H100x1
            cpu: 8
            memory: 64GB
            iris_timeout: 5400
            task_script: skyrl-train/ci/marin_nightly/run_h100.sh
            log: nightly.log
          - lane: grug-vllm-gb200
            target_cluster: ${{ github.event.inputs.grug_target_cluster || 'cw-us-east-08a' }}
            gpu: GB200x4
            cpu: 64
            memory: 512GB
            iris_timeout: 3600
            task_script: skyrl-train/ci/marin_nightly/run_grug_vllm.sh
            log: grug-vllm.log
          - lane: grug-megatron-h100
            target_cluster: ${{ github.event.inputs.target_cluster || 'cw-rno2a' }}
            gpu: H100x4
            cpu: 32
            memory: 256GB
            iris_timeout: 7200
            task_script: skyrl-train/ci/marin_nightly/run_grug_megatron.sh
            log: grug-megatron.log
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    env:
      JOB_NAME: marinskyrl-nightly-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
      MAX_STEPS: ${{ github.event.inputs.max_steps || '30' }}
      MODEL: ${{ github.event.inputs.model || 'Qwen/Qwen3-0.6B' }}
      STRATEGY: ${{ github.event.inputs.strategy || 'fsdp2' }}
      TARGET_CLUSTER: ${{ matrix.target_cluster }}
    steps:
      - uses: actions/checkout@v7

      - name: Trim the Iris bundle
        run: git rm -r --quiet skyrl-train/docs skyrl-agent

      # task_runtime.py refuses to start without a runtime-bundle identity, and the pod cannot
      # write one: Iris strips .git from the bundle, and the identity comes from a git checkout.
      # Stamp it here, where the real launcher stamps it.
      #
      # The file MUST stay untracked and unignored. Committing it freezes hashes that go stale at
      # the next edit to a bundled file; gitignoring it drops it from the bundle, because Iris
      # collects with `git ls-files --exclude-standard`, and the pod then refuses to start.
      - name: Stamp the runtime bundle identity
        if: matrix.lane == 'gsm8k-h100'
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          from cloud.iris.runtime_bundle import BUNDLE_IDENTITY_FILE, build_runtime_bundle

          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True
          ).stdout.strip()
          workspace = build_runtime_bundle(commit)
          shutil.copy2(workspace / BUNDLE_IDENTITY_FILE, Path(BUNDLE_IDENTITY_FILE))
          print(f"stamped {BUNDLE_IDENTITY_FILE} for {commit}")
          PY

      - uses: astral-sh/setup-uv@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Install the iris client
        run: |
          uv tool install --prerelease allow "$IRIS_CLIENT_REQUIREMENT"
          echo "$(uv tool dir)/marin-core/bin" >> "$GITHUB_PATH"

      - name: Run ${{ matrix.lane }}
        run: |
          set -o pipefail
          TASK_ENV=()
          if [[ "${{ matrix.lane }}" == "gsm8k-h100" ]]; then
            # The attempt matters: a re-run reuses the workflow run id, and two runs sharing a
            # telemetry identity overlay each other on the dashboard.
            RUN_ID="nightly-${{ matrix.lane }}-$STRATEGY-$(date -u +%Y.%m.%d)-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
            TASK_ENV=(-e MODEL "$MODEL" -e MAX_STEPS "$MAX_STEPS" -e RUN_ID "$RUN_ID" -e STRATEGY "$STRATEGY")
          fi
          iris --cluster marin job run \
            --target-cluster "$TARGET_CLUSTER" \
            --job-name "$JOB_NAME" \
            --gpu "${{ matrix.gpu }}" --enable-extra-resources \
            --cpu "${{ matrix.cpu }}" --memory "${{ matrix.memory }}" --disk 200GB \
            --no-sync \
            --timeout "${{ matrix.iris_timeout }}" \
            "${TASK_ENV[@]}" \
            -- bash "${{ matrix.task_script }}" 2>&1 | tee "${{ matrix.log }}"

      - name: Cancel any Iris job the run left behind
        if: always()
        run: iris --cluster marin job cancel "/runner/$JOB_NAME" || true

      # The report reaches the runner only through the streamed log. `iris job run` exits zero even
      # when the task inside it dies, so a missing report means the lane never got that far.
      - name: Summarize the run's dashboard
        # Absent RUN_ID means the job failed in setup, so there is nothing to summarize.
        if: always() && matrix.lane == 'gsm8k-h100' && env.RUN_ID != ''
        run: |
          python3 - "${{ matrix.log }}" "$RUN_ID" "$TARGET_CLUSTER" <<'PY'
          import json
          import os
          import pathlib
          import sys

          # `::warning::` is read from stdout; the summary is a file. One stream loses the other.
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          log, run_id, cluster = sys.argv[1], sys.argv[2], sys.argv[3]
          url = (
              f"https://grafana.oa.dev/d/marin-rl-runs?var-cluster={cluster}"
              f"&var-run={run_id}&from=now-24h&to=now"
          )
          print(f"### RL run view\n\n[{run_id}]({url})\n", file=summary)

          marker = "NIGHTLY_TELEMETRY_READINESS"
          if not pathlib.Path(log).exists():
              print("The lane produced no log, so it failed before training.", file=summary)
              raise SystemExit(0)

          lines = [line for line in pathlib.Path(log).read_text(errors="replace").splitlines() if marker in line]
          if not lines:
              print("The readiness report did not run, so the run may not be readable on the dashboard.", file=summary)
              raise SystemExit(0)

          report = json.loads(lines[-1].split(marker, 1)[1])
          if "error" in report:
              print(f"Readiness could not be checked: `{report['error']}`", file=summary)
              raise SystemExit(0)

          print("| signal | records | panel |", file=summary)
          print("| --- | --- | --- |", file=summary)
          for signal in report["signals"]:
              mark = "" if signal["records"] else " :warning:"
              print(f"| {signal['key']}{mark} | {signal['records']} | {signal['panel']} |", file=summary)
          summary.close()
          for key in report["missing"]:
              print(f"::warning::no telemetry for {key}; its panel will be empty")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.lane }}-run-log
          path: ${{ matrix.log }}
          if-no-files-found: ignore

  report-failure:
    needs: [gpu-gate]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: marin-community/marin-style/actions/report-failure@5094279da60b47b9a8fa8effaf7f73cd13f1e96f  # v0.4.0
        with:
          lane: gsm8k-h100-and-grug-vllm-gb200
          trigger-token: ${{ secrets.LOOM_TRIGGER_GH_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          triage-notes: >-
            The nightly runs dense H100 GRPO and a Grug GB200 rollout/train/broadcast
            cycle through WIF-authenticated Iris jobs. Separate Iris or cluster failures
            from lock, native-extension, and training regressions. A repository-local PR
            that fixes the tracked failure must end its body with a Fixes link to this
            issue. Use Part of only when the PR does not restore the lane.
