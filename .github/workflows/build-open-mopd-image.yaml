name: Build Open-MOPD image

on:
  workflow_dispatch:
    inputs:
      target_cluster:
        description: Builder used for the amd64 image
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - cw-rno2a

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_NAME: open-mopd-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: inputs.target_cluster == 'github-hosted'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.target_cluster == 'github-hosted'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build on the GitHub-hosted amd64 runner
        if: inputs.target_cluster == 'github-hosted'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.open-mopd
          platforms: linux/amd64
          push: true
          build-args: GITSHA=${{ github.sha }}
          tags: ghcr.io/marin-community/marinskyrl-opd-repro:opd-repro-${{ github.sha }}

      - uses: ./.github/actions/setup-iris
        if: inputs.target_cluster == 'cw-rno2a'

      - name: Build on an amd64 Iris node
        if: inputs.target_cluster == 'cw-rno2a'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$(uv tool dir)/marin-core/bin/iris" --cluster marin job run \
            --target-cluster "${{ inputs.target_cluster }}" \
            --job-name "$JOB_NAME" \
            --task-image docker.io/library/ubuntu:22.04 \
            --cpu 8 --memory 32GB --disk 100GB \
            --priority interactive --no-preemptible --max-retries 0 \
            --timeout 5400 --no-sync --enable-extra-resources \
            -e GITSHA "$GITHUB_SHA" \
            -e REGISTRY_USER "$GITHUB_ACTOR" \
            -e REGISTRY_TOKEN "$REGISTRY_TOKEN" \
            -- bash docker/build_open_mopd_kaniko.sh

      - name: Cancel any Iris job left behind
        if: always() && inputs.target_cluster == 'cw-rno2a'
        run: >-
          "$(uv tool dir)/marin-core/bin/iris" --cluster marin job cancel
          "/runner/$JOB_NAME" || true
