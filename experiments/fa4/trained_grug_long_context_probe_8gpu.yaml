# Two 4xGB200 nodes, eight colocated GPUs. A 9,172-token request shape from
# snowball_megatron_full.yaml. This is a matched staging comparison, not
# production throughput evidence.
entrypoint: standard
context_budget:
  request_window_tokens: 9216
  max_new_tokens_per_turn: 128
  max_turns: 1
environment:
  env_class: gsm8k
trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  offload_optimizer_during_rollouts: false
  gradient_checkpointing: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
  epochs: 1
  max_steps: 4
  update_epochs_per_batch: 1
  train_batch_size: 8
  policy_mini_batch_size: 8
  eval_batch_size: 64
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: -1
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-06
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 4
      expert_tensor_parallel_size: 1
      # The all-GPU and partial-offload pilots both missed their first Adam
      # allocation by 26 MiB. The 900 GiB job cgroup covers full offload's
      # measured 727 GiB host peak.
      optimizer_config_kwargs:
        optimizer_cpu_offload: true
        optimizer_offload_fraction: 1.0
        use_precision_aware_optimizer: true
      optimizer_checkpoint_sharding_type: dp_reshardable
      ddp_config:
        overlap_grad_reduce: true
        overlap_param_gather: true
        grad_reduce_in_fp32: false
  ref:
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 4
      expert_tensor_parallel_size: 1
  placement:
    colocate_all: true
    policy_num_nodes: 2
    policy_num_gpus_per_node: 4
  attn_backend: flash_attention_2
  hf_save_interval: -1
generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 1
  n_samples_per_prompt: 2
  # Eight policy shards leave less room than the sixteen-GPU probe. This still
  # provides far more 9,216-token KV slots than the two requests per engine need.
  gpu_memory_utilization: 0.4
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  sampling_params:
    temperature: 1.0
    top_p: 1.0
data:
  kind: parquet
  train_data: []
  val_data: []
extra_env:
  # GB200 fabric CUDA IPC can fail in PyTorch's expandable-segment cleanup.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
