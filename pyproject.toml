[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "marinskyrl"
version = "0.1.0"
description = "Marin's typed launcher and RL training runtime"
requires-python = "==3.12.*"
dependencies = [
    "verifyit[answer,schema,reasoning-gym,judge] @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/verifyit",
    "aiohttp>=3.13.3",
    "boto3",
    "datasets>=4.0.0",
    "debugpy==1.8.0",
    "fastapi",
    "filelock>=3.16",
    "fsspec>=2024.0.0",
    "func_timeout",
    "harbor-config @ git+https://github.com/marin-community/harbor@6b2e76e1dae5c084eed05edefefffcec8c0c1ad9#subdirectory=packages/harbor-config",
    "hf_transfer",
    "huggingface-hub>=0.34.0",
    "ijson>=3.5",
    "jinja2>=3.1",
    "math-verify==0.9.0",
    "hydra-core==1.3.7",
    "jaxtyping",
    "langdetect==1.0.9",
    "loguru",
    "marin-finelog",
    "marin-finelog-server",
    "marin-finestore>=0.2.135.dev36906221286",
    "marin-iris>=0.2.144.dev37540375919",
    "marin-iris-native",
    "marin-rigging[secrets]>=0.2.144.dev37540375919",
    "marin-rolloutengine @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/rolloutengine",
    "marin-shellbox[daytona,shellsim] @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/shellbox",
    "ninja",
    "nvidia-ml-py",
    "omegaconf",
    "openapi-schema-validator",
    "pandas",
    "polars",
    "pydantic>=2.12,<3",
    "pyarrow>=18",
    "pycosat==0.6.6",
    "pyyaml>=6.0",
    "ray==2.51.1",
    "requests",
    "reasoning-gym==0.1.25",
    "s3fs",
    "smart_open",
    "tensorboard",
    "taskcompendium @ git+https://github.com/marin-community/marin.git@2ef4786903053025ca7fcee40ea76476276ca872#subdirectory=lib/taskcompendium",
    "tqdm>=4.66",
    "tokenizers==0.22.2",
    "transformers==5.12.1",
    "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
    "xmltodict",
    "uvicorn",
    "wandb",
]

[project.optional-dependencies]
cpu = [
    "accelerate>=1.14,<2",
    "peft>=0.19",
    "tensordict",
    "torch==2.11.0",
    "torchdata",
]
cuda = [
    "setuptools==84.0.0 ; sys_platform == 'linux'",
    "cuda-toolkit[nvcc,cccl]==13.2.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.14.1 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.29.1 ; sys_platform == 'linux'",
]
vllm = [
    "setuptools==84.0.0 ; sys_platform == 'linux'",
    # The CPU audio wheel uses Torch for GPU resampling without loading a cu132 extension.
    "torchaudio==2.11.0+cpu ; sys_platform == 'linux'",
    "torchcodec==0.17.0+cu132 ; sys_platform == 'linux'",
    "cuda-toolkit[nvcc,cccl]==13.2.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.18.post1 ; sys_platform == 'linux'",
    "flashinfer-python==0.6.18.post1 ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "quack-kernels==0.6.5 ; sys_platform == 'linux'",
    "runai-model-streamer[gcs,s3]==0.16.1 ; sys_platform == 'linux'",
    "hs-connectors ; sys_platform == 'linux'",
    "speculators ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.14.1 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.29.1 ; sys_platform == 'linux'",
    "vllm==0.0.0.dev20261006+marin.47b411d5785d.cu132 ; sys_platform == 'linux'",
]
megatron = [
    "setuptools==84.0.0 ; sys_platform == 'linux'",
    "cuda-toolkit[nvcc,cccl]==13.2.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.18.post1 ; sys_platform == 'linux'",
    "flashinfer-python==0.6.18.post1 ; sys_platform == 'linux'",
    "nvidia-cutlass-dsl==4.7.1 ; sys_platform == 'linux'",
    # Keep the qualified FlashAttention 2 path for context parallelism.
    "flash-attn==2.8.3.post1+marin.cu132torch2141.1 ; sys_platform == 'linux'",
    "flash-linear-attention==0.4.2 ; sys_platform == 'linux'",
    "fast-hadamard-transform==1.1.0 ; sys_platform == 'linux'",
    "megatron-bridge==0.6.2+marin.torch2141.2 ; sys_platform == 'linux'",
    "megatron-core==0.19.2+marin.torch2141.4 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "nvidia-modelopt==0.47.0 ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.14.1 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.29.1 ; sys_platform == 'linux'",
    "transformer-engine[pytorch]==2.20.2 ; sys_platform == 'linux'",
    "transformer-engine-cu13==2.20.2 ; sys_platform == 'linux'",
    "transformer-engine-torch==2.20.2 ; sys_platform == 'linux'",
]
telemetry = [
    "marin-rigging[prometheus]",
    "memray ; sys_platform == 'linux'",
    "ray[default]",
]

[project.scripts]
marinskyrl = "cloud.iris.launch:main"

[dependency-groups]
analysis = [
    "matplotlib",
    "pandas",
    "tabulate",
]
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    { include-group = "analysis" },
    "litellm",
    "marin-shellbox[shellsim]",
    "marin-rigging[prometheus]>=0.2.123.dev35633925924",
    "marin-style @ git+https://github.com/marin-community/marin-style@727f180cd423246ca1a6164163a5883cda5bf52b",
    "prometheus-client",
    "pytest>=8.4",
    "pytest-asyncio",
    "pytest-xdist",
    "universal-pathlib",
]
harbor-test = ["harbor; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["marinskyrl", "cloud", "skyrl-gym/skyrl_gym", "skyrl-train/skyrl_train"]

[tool.hatch.build.targets.wheel.force-include]
"chat_templates" = "chat_templates"

[tool.uv]
package = true
prerelease = "allow"
required-version = ">=0.8.10"
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "megatron" }],
    [{ extra = "cpu" }, { extra = "vllm" }],
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
no-build-isolation-package = [
    "transformer-engine",
    "transformer-engine-torch",
]
override-dependencies = [
    "marin-rigging[secrets,prometheus]==0.2.158.dev37984346192",
]
constraint-dependencies = [
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-proto==1.43.0",
    "opentelemetry-exporter-otlp==1.43.0",
    "opentelemetry-exporter-otlp-proto-common==1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.43.0",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
    "opentelemetry-semantic-conventions==0.64b0",
    "opentelemetry-instrumentation==0.64b0",
    "opentelemetry-instrumentation-aiohttp-client==0.64b0",
    "opentelemetry-util-http==0.64b0",
    "opentelemetry-exporter-prometheus==0.64b0",
]
[tool.uv.extra-build-dependencies]
transformer-engine = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]

[tool.uv.sources]
langdetect = { url = "https://huggingface.co/datasets/open-athena/marinskyrl-gpu-wheelhouse/resolve/d761f1e357b6d5a9b80427f4710eb2e04adf1101/linux-x86_64/cp312/20260915-tinker-aime/langdetect-1.0.9-py3-none-any.whl" }
pycosat = { url = "https://huggingface.co/datasets/open-athena/marinskyrl-gpu-wheelhouse/resolve/d761f1e357b6d5a9b80427f4710eb2e04adf1101/linux-x86_64/cp312/20260915-tinker-aime/pycosat-0.6.6-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchcodec = { index = "pytorch-cu132", extra = "vllm", marker = "sys_platform == 'linux'" }
flash-attn = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/flash_attn-2.8.3.post1+marin.cu132torch2141.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/flash_attn-2.8.3.post1+marin.cu132torch2141.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
harbor = { git = "https://github.com/marin-community/harbor.git" }
hs-connectors = { git = "https://github.com/marin-community/speculators.git", rev = "ecac1b16278063e9640004135153882c02de5801", subdirectory = "hs_connectors" }
speculators = { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-trimmed-candidate-20261007-604f2c14/speculators-0.9.0a16.post1-py3-none-any.whl" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu132", extra = "cuda" },
    { index = "pytorch-cu132", extra = "megatron" },
    { index = "pytorch-cu132", extra = "vllm" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "cuda" },
    { index = "pytorch-cu132", extra = "megatron" },
    { index = "pytorch-cu132", extra = "vllm" },
]
flashinfer-cubin = { index = "flashinfer", marker = "sys_platform == 'linux'" }
vllm = [
    { url = "https://github.com/marin-community/vllm/releases/download/marin-vllm-gpu-staged-candidate-47b411d5785d/vllm-0.0.0.dev20261006+marin.47b411d5785d.cu132-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/marin-community/vllm/releases/download/marin-vllm-gpu-staged-candidate-47b411d5785d/vllm-0.0.0.dev20261006+marin.47b411d5785d.cu132-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
transformer-engine-torch = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-te220-cu132-torch2141-20261009-23cd4509/transformer_engine_torch-2.20.2-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-te220-cu132-torch2141-20261009-23cd4509/transformer_engine_torch-2.20.2-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
megatron-core = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-trimmed-candidate-20261007-604f2c14/megatron_core-0.19.2+marin.torch2141.4-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-trimmed-candidate-20261007-604f2c14/megatron_core-0.19.2+marin.torch2141.4-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
megatron-bridge = { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-trimmed-candidate-20261007-604f2c14/megatron_bridge-0.6.2+marin.torch2141.2-py3-none-any.whl", marker = "sys_platform == 'linux'" }
fast-hadamard-transform = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/fast_hadamard_transform-1.1.0-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/fast_hadamard_transform-1.1.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
nvidia-cusparselt-cu13 = { url = "https://github.com/marin-community/MarinSkyRL/releases/download/native-cu132-cusparselt081-armtag-20261004/nvidia_cusparselt_cu13-0.8.1-py3-none-manylinux2014_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
harbor-config = { git = "https://github.com/marin-community/harbor", rev = "6b2e76e1dae5c084eed05edefefffcec8c0c1ad9", subdirectory = "packages/harbor-config" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[tool.marin-style]
checks = ["ruff-check", "ruff-format"]
ruff_version = "0.14.3"
include = ["marinskyrl/**", "skyrl-train/**", "skyrl-gym/**", "skyrl-tx/**", "cloud/**", "scripts/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"skyrl-train/tests/cpu/models/test_models.py" = ["E402"]
"skyrl-train/tests/cpu/test_ray_metrics.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-v -s -m 'not docker'"
testpaths = ["skyrl-train/tests", "cloud/iris/tests"]
markers = [
    "docker: local Docker execution; run explicitly in the container test lane",
    "nightly: extended CPU learning and checkpoint-resume coverage",
    "vllm",
    "integrations",
    "megatron",
    "slow: long-running test with its own Ray cluster; started first, with concurrency bounded by host memory",
]
