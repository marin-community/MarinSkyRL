[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl"
version = "0.1.0"
description = "A Post-Training Stack for LLMs"
authors = [
    { name = "NovaSkyAI Team"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[dependency-groups]
analysis = [
    "matplotlib",
    "pandas",
]
dev = [
    "boto3",
    "fsspec",
    "huggingface-hub",
    "marin-style @ git+https://github.com/marin-community/marin-style@ccbf03e7ca58486d61fff7a4e73031673d7fd8a4",
    "pytest",
    "universal-pathlib",
]

[tool.marin-style]
checks = ["ruff-check", "ruff-format"]
ruff_version = "0.14.3"
include = ["skyrl-train/**", "skyrl-gym/**", "skyrl-tx/**", "cloud/**", "scripts/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722"
]
