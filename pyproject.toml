[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "marinskyrl"
version = "0.1.0"
description = "Marin's typed launcher and RL training runtime"
requires-python = "==3.12.*"
dependencies = [
    "verifyit[answer,schema,reasoning-gym,judge] @ git+https://github.com/marin-community/verifyit@a04f28fd8c00879f949031e58ce9fbe5f4d5da6e",
    "aiohttp>=3.13.3",
    "boto3",
    "datasets>=4.0.0",
    "debugpy==1.8.0",
    "fastapi",
    "filelock>=3.16",
    "fsspec>=2024.0.0",
    "func_timeout",
    "hf_transfer",
    "huggingface-hub>=0.34.0",
    "ijson>=3.5",
    "math-verify==0.9.0",
    "hydra-core==1.3.7",
    "jaxtyping",
    "langdetect==1.0.9",
    "loguru",
    "marin-finelog",
    "marin-finelog-server",
    "marin-finestore>=0.2.135.dev36906221286",
    "marin-iris",
    "marin-iris-native",
    "marin-rigging[secrets]>=0.2.123.dev35633925924",
    "ninja",
    "nvidia-ml-py",
    "omegaconf",
    "openapi-schema-validator",
    "pandas",
    "polars",
    "pydantic>=2.12,<3",
    "pyarrow>=18",
    "pycosat==0.6.6",
    "pyyaml>=6.0",
    "ray==2.51.1",
    "requests",
    "reasoning-gym==0.1.25",
    "s3fs",
    "smart_open",
    "tensorboard",
    "tqdm>=4.66",
    "tokenizers==0.23.2",
    "transformers==5.18.0",
    "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
    "xmltodict",
    "uvicorn",
    "wandb",
]

[project.optional-dependencies]
cpu = [
    "accelerate>=1.14,<2",
    "harbor-config",
    "peft>=0.19",
    "tensordict",
    "torch==2.11.0",
    "torchdata",
]
cuda = [
    "cuda-toolkit[nvcc,cccl]==13.2.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.14.1 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.29.1 ; sys_platform == 'linux'",
]
megatron = [
    "cuda-toolkit[nvcc,cccl]==13.2.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "causal-conv1d==1.7.0+marin.cu132torch2141.1 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.18.post1 ; sys_platform == 'linux'",
    "flashinfer-python==0.6.18.post1 ; sys_platform == 'linux'",
    "nvidia-cutlass-dsl==4.7.1 ; sys_platform == 'linux'",
    # Keep the qualified FlashAttention 2 path for context parallelism.
    "flash-attn==2.8.3.post1+marin.cu132torch2141.1 ; sys_platform == 'linux'",
    "flash-linear-attention==0.5.2 ; sys_platform == 'linux'",
    "fast-hadamard-transform==1.1.0 ; sys_platform == 'linux'",
    "mamba-ssm==2.3.2.post1+marin.cu132torch2141.1 ; sys_platform == 'linux'",
    "megatron-bridge==0.6.2+marin.torch2141.1 ; sys_platform == 'linux'",
    "megatron-core==0.19.2+marin.torch2141.3 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "nvidia-modelopt==0.47.0 ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.14.1 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.29.1 ; sys_platform == 'linux'",
    "transformer-engine[pytorch]==2.19.0 ; sys_platform == 'linux'",
    "transformer-engine-cu13==2.19.0 ; sys_platform == 'linux'",
    "transformer-engine-torch==2.19.0 ; sys_platform == 'linux'",
]
telemetry = [
    "marin-rigging[prometheus]>=0.2.123.dev35633925924",
    "memray ; sys_platform == 'linux'",
    "ray[default]",
]

[project.scripts]
marinskyrl = "cloud.iris.launch:main"

[dependency-groups]
analysis = [
    "matplotlib",
    "pandas",
    "tabulate",
]
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    { include-group = "analysis" },
    "litellm",
    "marin-rigging[prometheus]>=0.2.123.dev35633925924",
    "marin-style @ git+https://github.com/marin-community/marin-style@727f180cd423246ca1a6164163a5883cda5bf52b",
    "prometheus-client",
    "pytest>=8.4",
    "pytest-asyncio",
    "pytest-xdist",
    "universal-pathlib",
]
harbor-test = ["harbor; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel.force-include]
"chat_templates" = "chat_templates"
"cloud/iris" = "cloud/iris"
"skyrl-gym/skyrl_gym" = "skyrl_gym"
"skyrl-train/skyrl_train" = "skyrl_train"

[tool.uv]
package = true
prerelease = "allow"
required-version = ">=0.8.10"
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "megatron" }],
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
no-build-isolation-package = [
    "transformer-engine",
    "transformer-engine-torch",
]
[tool.uv.extra-build-dependencies]
transformer-engine = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]

[tool.uv.sources]
langdetect = { url = "https://huggingface.co/datasets/open-athena/marinskyrl-gpu-wheelhouse/resolve/d761f1e357b6d5a9b80427f4710eb2e04adf1101/linux-x86_64/cp312/20260915-tinker-aime/langdetect-1.0.9-py3-none-any.whl" }
pycosat = { url = "https://huggingface.co/datasets/open-athena/marinskyrl-gpu-wheelhouse/resolve/d761f1e357b6d5a9b80427f4710eb2e04adf1101/linux-x86_64/cp312/20260915-tinker-aime/pycosat-0.6.6-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
flash-attn = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/flash_attn-2.8.3.post1+marin.cu132torch2141.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/flash_attn-2.8.3.post1+marin.cu132torch2141.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
harbor = { git = "https://github.com/marin-community/harbor.git" }
hs-connectors = { git = "https://github.com/lukedhlee/speculators.git", rev = "6496b4db007de00dd4741349643d23b23e29dce8", subdirectory = "hs_connectors" }
speculators = { git = "https://github.com/lukedhlee/speculators.git", rev = "6496b4db007de00dd4741349643d23b23e29dce8" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu132", extra = "cuda" },
    { index = "pytorch-cu132", extra = "megatron" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "cuda" },
    { index = "pytorch-cu132", extra = "megatron" },
]
flashinfer-cubin = { index = "flashinfer", marker = "sys_platform == 'linux'" }
transformer-engine-torch = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/transformer_engine_torch-2.19.0-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/transformer_engine_torch-2.19.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
causal-conv1d = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/causal_conv1d-1.7.0+marin.cu132torch2141.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/causal_conv1d-1.7.0+marin.cu132torch2141.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
mamba-ssm = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/mamba_ssm-2.3.2.post1+marin.cu132torch2141.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/mamba_ssm-2.3.2.post1+marin.cu132torch2141.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
megatron-core = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/megatron_core-0.19.2+marin.torch2141.3-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/megatron_core-0.19.2+marin.torch2141.3-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
megatron-bridge = { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/megatron_bridge-0.6.2+marin.torch2141.1-py3-none-any.whl", marker = "sys_platform == 'linux'" }
fast-hadamard-transform = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/fast_hadamard_transform-1.1.0-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/trainer-native-cu132-torch2141-20261004-db1a32ca/fast_hadamard_transform-1.1.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
nvidia-cusparselt-cu13 = { url = "https://github.com/marin-community/MarinSkyRL/releases/download/native-cu132-cusparselt081-armtag-20261004/nvidia_cusparselt_cu13-0.8.1-py3-none-manylinux2014_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
harbor-config = { url = "https://github.com/marin-community/harbor/releases/download/harbor-config-952a005353273590631b8f970f4664a121710b32/harbor_config-0.1.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[tool.marin-style]
checks = ["ruff-check", "ruff-format"]
ruff_version = "0.14.3"
include = ["marinskyrl/**", "skyrl-train/**", "skyrl-gym/**", "skyrl-tx/**", "cloud/**", "scripts/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"skyrl-train/tests/cpu/models/test_models.py" = ["E402"]
"skyrl-train/tests/cpu/test_ray_metrics.py" = ["E402"]
"skyrl-train/skyrl_train/trajectory_runners/harbor/_harbor_compat.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["skyrl-train/tests", "cloud/iris/tests"]
markers = [
    "nightly: extended CPU learning and checkpoint-resume coverage",
    "vllm",
    "integrations",
    "megatron",
    "slow: long-running test with its own Ray cluster; started first, with concurrency bounded by host memory",
]
