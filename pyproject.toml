[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marinskyrl"
version = "0.1.0"
description = "Marin's typed launcher and RL training runtime"
requires-python = "==3.12.*"
dependencies = [
    "boto3",
    "datasets>=4.0.0",
    "debugpy==1.8.0",
    "fastapi",
    "fsspec>=2024.0.0",
    "func_timeout",
    "hf_transfer",
    "huggingface-hub>=0.34.0",
    "hydra-core==1.3.2",
    "jaxtyping",
    "loguru",
    "marin-finelog",
    "marin-finelog-server",
    "marin-iris",
    "marin-iris-native",
    "ninja",
    "nvidia-ml-py",
    "omegaconf",
    "pandas",
    "polars",
    "pyyaml>=6.0",
    "ray==2.51.1",
    "requests",
    "reasoning-gym==0.1.25",
    "s3fs",
    "smart_open",
    "tensorboard",
    "tqdm>=4.66",
    "transformers>=5.8.1,<5.9",
    "uvicorn",
    "wandb",
]

[project.optional-dependencies]
cpu = [
    "accelerate>=1.14,<2",
    "harbor-config",
    "peft>=0.19",
    "tensordict",
    "torch==2.11.0",
    "torchdata",
]
cuda = [
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
]
deepspeed = [
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "deepspeed==0.17.6 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
]
fsdp = [
    "flash-attn==2.8.3 ; sys_platform == 'linux'",
    "torchtitan ; sys_platform == 'linux'",
]
vllm = [
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-python==0.6.12 ; sys_platform == 'linux'",
    "harbor[analysis,datasets,daytona] ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "quack-kernels==0.5.0 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
    "vllm==0.0.0.dev20260805+marin.fa50698a9a30.cu129 ; sys_platform == 'linux'",
]
megatron = [
    "accelerate>=1.14,<2 ; sys_platform == 'linux'",
    "causal-conv1d>=1.5,<2 ; sys_platform == 'linux'",
    "flash-linear-attention==0.4.2 ; sys_platform == 'linux'",
    "mamba-ssm>=2.2,<3 ; sys_platform == 'linux'",
    "megatron-bridge==0.5.0 ; sys_platform == 'linux'",
    "megatron-core==0.18.0 ; sys_platform == 'linux'",
    "harbor-config ; sys_platform == 'linux'",
    "nvidia-modelopt==0.45.0 ; sys_platform == 'linux'",
    "peft>=0.19 ; sys_platform == 'linux'",
    "tensordict ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchdata ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
    "transformer-engine[pytorch]==2.11.0 ; sys_platform == 'linux'",
    "transformer-engine-cu12==2.11.0 ; sys_platform == 'linux'",
    "transformer-engine-torch==2.11.0 ; sys_platform == 'linux'",
]
telemetry = [
    "marin-rigging[prometheus]",
    "memray ; sys_platform == 'linux'",
    "ray[default]",
]

[project.scripts]
marinskyrl = "cloud.iris.job:main"

[dependency-groups]
analysis = [
    "matplotlib",
    "pandas",
    "tabulate",
]
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    { include-group = "analysis" },
    "litellm",
    "marin-rigging[prometheus]",
    "marin-style @ git+https://github.com/marin-community/marin-style@5094279da60b47b9a8fa8effaf7f73cd13f1e96f",
    "prometheus-client",
    "pytest>=8.4",
    "pytest-asyncio",
    "universal-pathlib",
]
harbor-test = ["harbor; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel.force-include]
"chat_templates" = "chat_templates"
"cloud/iris" = "cloud/iris"
"skyrl-gym/skyrl_gym" = "skyrl_gym"
"skyrl-train/skyrl_train" = "skyrl_train"

[tool.uv]
package = true
prerelease = "allow"
required-version = ">=0.8.10"
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "deepspeed" }],
    [{ extra = "cpu" }, { extra = "megatron" }],
    [{ extra = "cpu" }, { extra = "vllm" }],
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
no-build-isolation-package = [
    "transformer-engine",
    "transformer-engine-torch",
]
override-dependencies = [
    "transformer-engine-cu13 ; sys_platform == 'never'",
    "nvidia-resiliency-ext ; sys_platform == 'never'",
    "fsspec==2026.4.0",
    "nvidia-cutlass-dsl>=4.5.2,<4.6 ; sys_platform == 'linux'",
    "humming-kernels==0.1.4 ; sys_platform == 'linux'",
    "cuda-tile==1.3.0 ; sys_platform == 'linux'",
    "flashinfer-python==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.12 ; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.6.12 ; sys_platform == 'linux'",
    "opentelemetry-api==1.44.0 ; sys_platform == 'linux'",
    "opentelemetry-api ; sys_platform != 'linux'",
]
constraint-dependencies = [
    "botocore==1.42.97 ; sys_platform == 'linux'",
    "boto3==1.42.97 ; sys_platform == 'linux'",
    "s3transfer==0.16.1 ; sys_platform == 'linux'",
    "aiobotocore==3.7.0 ; sys_platform == 'linux'",
    "s3fs==2026.4.0 ; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
transformer-engine = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }, "build_tools", "ninja"]

[tool.uv.sources]
flash-attn = [
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/flash-attn-cu129-torch2.11-2.8.3/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/marin-community/MarinSkyRL/releases/download/flash-attn-cu129-torch2.11-2.8.3/flash_attn-2.8.3-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
harbor = { git = "https://github.com/marin-community/harbor.git" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu129", extra = "cuda" },
    { index = "pytorch-cu129", extra = "deepspeed" },
    { index = "pytorch-cu129", extra = "megatron" },
    { index = "pytorch-cu129", extra = "vllm" },
]
torchvision = [
    { index = "pytorch-cu129", extra = "cuda" },
    { index = "pytorch-cu129", extra = "deepspeed" },
    { index = "pytorch-cu129", extra = "megatron" },
    { index = "pytorch-cu129", extra = "vllm" },
]
flashinfer-jit-cache = { index = "flashinfer-cu129", marker = "sys_platform == 'linux'" }
vllm = [
    { url = "https://github.com/marin-community/vllm/releases/download/marin-vllm-gpu-20260805-fa50698a9a30/vllm-0.0.0.dev20260805+marin.fa50698a9a30.cu129-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/marin-community/vllm/releases/download/marin-vllm-gpu-20260805-fa50698a9a30/vllm-0.0.0.dev20260805+marin.fa50698a9a30.cu129-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
transformer-engine-torch = [
    { url = "https://github.com/erictang000/TransformerEngine/releases/download/v2.11.0-torch2.11/transformer_engine_torch-2.11.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/erictang000/TransformerEngine/releases/download/v2.11.0-torch2.11/transformer_engine_torch-2.11.0-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
causal-conv1d = [
    { url = "https://github.com/erictang000/causal-conv1d/releases/download/v1.6.1.post4-torch2.11/causal_conv1d-1.6.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/erictang000/causal-conv1d/releases/download/v1.6.1.post4-torch2.11/causal_conv1d-1.6.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
mamba-ssm = [
    { url = "https://github.com/erictang000/mamba/releases/download/v2.3.1-torch2.11/mamba_ssm-2.3.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/erictang000/mamba/releases/download/v2.3.1-torch2.11/mamba_ssm-2.3.1-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
harbor-config = { url = "https://github.com/marin-community/harbor/releases/download/harbor-config-df866b3086f386221e6e04ecf4b09e3cc9ffe44e/harbor_config-0.1.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu129"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[tool.marin-style]
checks = ["ruff-check", "ruff-format"]
ruff_version = "0.14.3"
include = ["marinskyrl/**", "skyrl-train/**", "skyrl-gym/**", "skyrl-tx/**", "cloud/**", "scripts/**"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"skyrl-train/tests/gpu/test_e2e_moe_rl_step.py" = ["E402"]
"skyrl-train/tests/gpu/test_e2e_moe_rl_step_80b.py" = ["E402"]
"skyrl-train/tests/cpu/distributed/test_muon_hybrid.py" = ["E402"]
"skyrl-train/tests/cpu/models/test_moe_weight_remap.py" = ["E402"]
"skyrl-train/tests/cpu/models/test_models.py" = ["E402"]
"skyrl-train/tests/cpu/test_ray_metrics.py" = ["E402"]
"skyrl-train/skyrl_train/trajectory_runners/harbor/_harbor_compat.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["skyrl-train/tests", "cloud/iris/tests"]
markers = [
    "vllm",
    "integrations",
    "megatron",
]
